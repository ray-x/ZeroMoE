# MoE usage survey config for Qwen3.8-Flash-Next -- full-graph decode
# (verified ~27-28 tok/s steady-state) PLUS the new decode-only
# router-usage tap (engine.qwen4exp_track_router_usage), which makes real
# per-token routing visible to StreamingEngine::route_freq without giving up
# full-graph's throughput (smoke-tested: ~0.012ms callback overhead/token,
# steady-state decode unchanged at ~34-36ms/token).
#
# Launch with (adds ZEROMOE_QWEN4EXP_FULL_GRAPH=1 vs the older
# gpu_stage_test.toml recipe -- decode's full graph requires prefill to have
# ALSO run through full graph first, to seed GDN/KV/PLE state; this also
# turns out to give route_freq_prefill real data for free, via the existing
# pilot-router prefetch pass, which still runs through the legacy
# moe_router_service.cpp path even when full-graph prefill is on):
#   ZEROMOE_SURVEY_BINARY=build_ggmlcuda/zeromoe
#   CUDA_VISIBLE_DEVICES=0 ZEROMOE_CUDA_SCHEDULE=auto
#   ZEROMOE_QWEN4EXP_FULL_GRAPH=1 ZEROMOE_QWEN4EXP_FULL_GRAPH_DECODE=1
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_TRAILING=1 ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_LAYERS=22
#   ZEROMOE_BENCH_IGNORE_STOP=1

model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M/Qwen3.8-Flash-Next-UD-IQ1_M-00001-of-00003.gguf"

cpu_affinity_layers = []
log_path = "/home/ray/Projects/ZeroMoE/logs/qwen4exp_survey_106prompts_usage_tap.log"
log_level = "INFO"

context_size = 2048
max_new_tokens = 150
temperature = 0.0
top_p = 0.95
raw_prompt = false
enable_thinking = false

direct_io = false
io_uring = false
drop_pages = true

host_ram_gb = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
pinned_vram_capacity = 128
expert_fetch_threads = 10
omp_max_threads = 12
prefetch_worker_threads = 4

# SURVEY: dedicated fresh usage files (not the option_b_layer13 ones, which
# came out empty -- see qwen4exp_track_router_usage's own comment for why).
# freeze_usage_stats=false so this 106-prompt run actually accumulates fresh
# (layer,expert) hit counts.
pin_file           = "/home/ray/Projects/ZeroMoE/tests/moe_usage_survey/zeromoe_usage_survey_qwen4exp_usage_tap"
prefill_pin_file   = "/home/ray/Projects/ZeroMoE/tests/moe_usage_survey/zeromoe_usage_survey_qwen4exp_usage_tap_prefill"
freeze_usage_stats = false

qwen4exp_option_b_layer = -1
qwen4exp_option_b_top_n = 256
qwen4exp_option_b_min_coverage = 0.80
qwen4exp_option_b_stage_expert = -1
qwen4exp_option_b_stage_count = 1

qwen4exp_full_graph = true
qwen4exp_full_graph_decode = true
qwen4exp_cpu_gpu_overlap = true
qwen4exp_cpu_gpu_overlap_max_layers = 0

qwen4exp_decode_device_hc = true
qwen4exp_decode_gpu_router = false
qwen4exp_decode_ggml_moe = true
qwen4exp_cpu_ggml_moe = true
qwen4exp_cpu_strided_grouped = true
qwen4exp_cpu_fused_grouped = true
moe_ggml_mul_mat_id = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_gpu_router = true
moe_ggml_device = 0
qwen4exp_cpu_shared_device = true
hc_ggml = true
gdn_full_ggml = true
qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true
moe_gpu_accum = true
expert_gpu_activation = true

use_active_layer_area = true
active_layer_capacity = 10
decode_async_prewarm = false
prefetch_pilot_depth = 1
prefetch_pilot_k = 10
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.9

# Leftover single-layer GPU-staging test from an earlier session -- off, not
# relevant to this run.
qwen4exp_gpu_stage_enabled = false
qwen4exp_gpu_stage_layers = []

# The new decode-only router-usage tap under test.
qwen4exp_track_router_usage = true

[[gpus]]
device_id = 0
name = "RTX 3090"
role = "dense+moe"
dense_gb = 4.1
kv_cache_gb = 2.0
moe_cache_gb = 11.5
kv_bits = 4
