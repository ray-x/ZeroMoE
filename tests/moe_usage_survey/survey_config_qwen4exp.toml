# Qwen3.8-Flash-Next (GGUF arch "qwen4exp") MoE usage survey config.
#
# Cloned from configs/testing/qwen4exp_3090_only.toml (the verified, tuned
# single-3090 profile for this model on this box -- see that file's own
# header/history for the measured basis of every flag below) with three
# survey-specific changes:
#   1. model_path points at the explicit first SHARD FILE, not the
#      directory -- the directory form silently merges the sibling MTP
#      checkpoint (mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf) in as a bogus
#      4th shard (see memory qwen4exp-model-dir-scan-picks-up-mtp-file;
#      harmless by numerical coincidence for ordinary inference, but there
#      is no reason to carry the contamination into a fresh usage capture).
#   2. pin_file/prefill_pin_file point at dedicated, fresh survey usage
#      files (not the live production/tuning pin files) with
#      freeze_usage_stats=false, so RAMSafetyManager's per-(layer,expert)
#      routing histogram actually accumulates across the 106-prompt run --
#      same "SURVEY: dedicated file" convention as survey_config.toml (GLM).
#   3. max_new_tokens lowered to 120 as a config-level default; the actual
#      run drives generation length via run_survey.py's --ngen flag
#      combined with ZEROMOE_BENCH_IGNORE_STOP=1 (see
#      generation_loop.hpp's bench_ignore_stop), which forces EXACTLY
#      max_new_tokens output tokens per prompt instead of stopping at the
#      model's own EOS/turn-boundary token. This is required because the
#      prior 106-prompt/100-token survey run averaged only ~39 decode
#      tokens/prompt (4120 decode tokens / 106 prompts) -- most of the daily/
#      general-question prompts hit natural EOS far short of the requested
#      cap, undershooting the >=120-token-per-question requirement.

model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M/Qwen3.8-Flash-Next-UD-IQ1_M-00001-of-00003.gguf"

log_path  = "/home/ray/Projects/ZeroMoE/logs/qwen4exp_survey_106prompts_120tokens.log"
log_level = "INFO"

context_size   = 2048
max_new_tokens = 120
temperature    = 0.0
top_p          = 0.95
enable_thinking = false

# --- I/O ---------------------------------------------------------------
direct_io  = false
io_uring   = false
drop_pages = true

# --- Host RAM expert tier ---------------------------------------------
host_ram_gb          = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
expert_fetch_threads = 10
omp_max_threads      = 12
prefetch_worker_threads = 4

# SURVEY: dedicated usage files, not the live production/tuning pin files
# used by configs/testing/qwen4exp_3090_only.toml. freeze_usage_stats=false so this
# 106-prompt run actually accumulates fresh (layer,expert) hit counts.
pin_file           = "/home/ray/Projects/ZeroMoE/tests/moe_usage_survey/zeromoe_usage_survey_qwen4exp"
prefill_pin_file   = "/home/ray/Projects/ZeroMoE/tests/moe_usage_survey/zeromoe_usage_survey_qwen4exp_prefill"
freeze_usage_stats = false
pin_topk_per_layer   = 1
pinned_vram_capacity = 9977
pin_threshold        = 6
promote_hit_threshold = 6
promote_h2d_threshold = 6

ram_cache_layer_adaptive = false
vram_evict_demote_to_ram = true
prefetch_pilot_depth = 1
prefetch_pilot_k     = 10
qwen4exp_router_pilot = true
qwen4exp_router_pilot_k = 10
qwen4exp_router_pilot_prefetch = true
qwen4exp_router_pilot_prefetch_k = 5
qwen4exp_router_pilot_prefetch_exclude_layers = [20, 21, 22, 25, 26, 27, 28, 30, 31, 33, 34, 35, 36, 37, 38]
qwen4exp_router_pilot_skip_fully_cached = true
qwen4exp_router_pilot_skip_prefetch_excluded_layers = true
qwen4exp_router_pilot_predict_layers = [2, 4, 5, 6, 7, 12, 13, 14, 40]
cpu_dot_ggml_iq1m = true
prefill_warm_via_prefetcher = true

use_active_layer_area = true
active_layer_capacity = 128
active_layer_promote_hit_threshold = 1
speculative_active_layer_promote_on_confirm = false
active_layer_upload_worker_threads = 0
decode_async_prewarm = true
decode_async_prewarm_nonblocking = true
speculative_promote_to_active_layer = false
# --- MLA-only GPU fast paths: qwen4exp is NOT an MLA family -----------
attn_qabsorb_gpu = false
attn_score_gpu   = false

moe_prefill_stream = false
moe_prefill_stream_chunk = 32
moe_expert_bf16_gemm = true

moe_ggml_mul_mat_id = true
qwen4exp_decode_ggml_moe = true
qwen4exp_decode_device_hc = true
qwen4exp_decode_batch_stage = true
qwen4exp_decode_custom_hc_q8 = false
qwen4exp_decode_gpu_router = false
qwen4exp_cpu_ggml_moe = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_device     = 0
moe_ggml_gpu_router = true

hc_ggml             = true
gdn_proj_ggml       = true
gdn_full_ggml = true

pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
vram_preload_prefix_layers = 0
vram_cache_full_layer_prefix = 0
pin_vram_lru_fraction = 0.0
pin_ram_fraction = 1.0

moe_prefill_batched = true
dense_bf16_prefill_gemm = true
dense_async_copies = true
dense_bf16_kquant = true

qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
moe_gpu_accum = true
expert_gpu_activation = true

mem_guard          = true
mem_guard_warn_mb  = 16384
mem_guard_stop_mb  = 10240
mem_guard_poll_ms  = 500

vram_min_free_mb   = 256

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 4.1
kv_cache_gb  = 2.0
kv_bits      = 4
moe_cache_gb = 17
