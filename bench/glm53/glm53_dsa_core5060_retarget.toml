prefetch_pilot_depth = 1  # 1: layer + 1 only, 2: layer + 1 and 2
# prefetch_pilot_k: raised 4->8 (2026-08-19), real same-prompt A/B on real
# hardware. Root cause: the "Unified RAM claim" report line showed only
# 2538/5546 decode misses (45.7%) were being served by a prefetch worker --
