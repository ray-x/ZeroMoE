# GPU 0 (nvidia-smi): RTX 3090 — ExpertVault (MoE expert LRU in VRAM). The
# expert-dispatch path dominates wall time, so the faster card goes here.
# --- Prefill sliding-window RAM capacity (2026-08-31) -----------------
# VERIFIED ON REAL HARDWARE: prefill 106.07s -> 75.91s (0.94 -> 1.32 tok/s,
# +40%), whole request 157.58s -> 127.03s (-19.4%), cache hit 54% -> 74%,
# decode-only UNCHANGED (0.777 -> 0.782 tok/s -- the feature is S>1-gated).
# 0 errors, output confirmed coherent. Prefill reproduced 3x (75.33/75.33/
# 75.91s) vs baseline 3x (106.25/106.64/106.07s) -- no overlap.
#
# WHY: calculate_safe_cache_capacity divides the RAM budget by ALL n_layers
# (right for decode -- every token traverses every layer), giving 76 slots/
# layer. But prefill runs layers SEQUENTIALLY, so one layer is live while
# ~74 sit on unusable budget -- and that live layer really needs ~212 unique
# experts for a 100-token prompt. The prefetcher was therefore evicting its
# OWN not-yet-consumed work: 82.2% of all prefetch reads (~97GB of ~118GB)
# fetched and thrown away unread. Now 0.0%.
#
# extra_gb is the memory bound. With P3's trim-on-exit the extra slots are
# freed and RETURNED to this budget as the window slides, so it caps extra
# memory IN FLIGHT (~3 layers), not total ever granted -- 12GB covered all
# 75 layers with 0 denied and RSS no worse than baseline.
# Re-enabled 2026-09-01. It was disabled when it appeared to cause a NaN
# cascade + garbled output, but the window was NOT the cause: the real bug
# was an unguarded slab free racing a queued ActiveLayerUploadWorkItem
# (fixed in ensure_slab_capacity/release_slab), which the window merely
# made far more frequent. With that fixed, window ON + worker pool ON runs
# clean, and the window is worth ~35% on prefill (0.93 -> 1.27 tok/s).
prefill_window_cap = true
prefill_window_extra_gb = 12.0


