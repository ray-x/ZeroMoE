# cpu_offload_max_experts: implemented + real hardware A/B'd (2026-08-25),
# REVERTED to 0/off -- a real, clean, twice-confirmed REGRESSION on this
# hardware, not a win. See CLAUDE.md's "CPU-offload feasibility" entries for
# the full writeup: this codebase's own already-measured numbers (avg CPU
# expert ~3.9ms/call vs avg GPU round-trip ~0.42ms/call, ~9x slower) predict
# exactly this outcome in hindsight -- the DMA this feature skips is a much
# smaller cost than the CPU compute it adds. Do not re-enable without a
# structural change (e.g. only offloading GPU-unsupported quant types that
# were headed to CPU anyway) -- see that entry before re-attempting.
# cpu_dot_ggml_avx2: real A/B'd (2026-08-25) after wiring into production --
# caught and fixed a real OMP-spawn-at-S=1 bug along the way (see kernels_
# cpu.cpp's matmul_iq2/3_xxs_ggml_avx2), but even after that fix the real
# decode-level impact was marginal (cpu= bucket -12.6% with cpu_offload_
# max_experts=2, decode 0.81->0.82 tok/s, still well short of the 0.86
# tok/s baseline) -- the isolated ~1.7-1.9x per-dot speedup doesn't survive
# contact with the real per-call Q8_K activation-quantization cost at this
# call pattern. Reverted to off. See CLAUDE.md for the full writeup.
cpu_offload_max_experts = 0
cpu_dot_ggml_avx2 = false
# ATTN-PILOT real hint wiring (2026-08-25) -- real A/B (3 runs each): OFF
# avg 0.84 tok/s decode (0.86/0.80/0.86), ON avg 0.86 (0.87/0.85/0.86) --
# a small, consistent-direction signal (tighter band, never dipped as low
# as OFF's worst run), not yet fully decisive given this hardware's own
# documented run-to-run noise (non-bit-exact routing). Zero errors across
# all 6 runs, mechanism confirmed engaging correctly (2449/2449 fetch-
# worthy picks covered). Attempt 3 below (top-2 VRAM promote + this k=8
# push, DEPTH-1 held at its own top-2) was NOT a regression -- unlike
# attempts 1/2, a real improvement over the previous outright-regression
# results -- but across 3 runs (0.88/0.88/0.83 decode) landed within this
# hardware's own established baseline noise band, not clearly above it.
# Left OFF pending more runs, same status as the plain-hint-push-only test
# above. Attempt 4 (top_k=1, even more conservative) landed dead-center of
# the baseline band, not above it -- see attn_pilot_vram_promote_top_k's
# own comment for the full result. See CLAUDE.md for the full writeup.
prefetch_attn_pilot = false  # 2026-08-29 RE-TESTED (hint-push only, RAM tier, no VRAM promotion): mean 0.947 vs baseline 0.966 across 3 runs each, but individual runs (0.901-0.977) overlap heavily with baseline's own spread (0.928-0.992) -- ambiguous, not a clear win or regression, same "not proven" status as before. RAM waste stayed healthy (3.7-8.9%), 0 errors. Left off -- see CLAUDE.md.
prefetch_attn_pilot_k = 8
# attn_pilot_vram_promote_top_k: two real attempts, both regressed, both
# reverted -- see CLAUDE.md for the full writeup.
# Attempt 1 (top_k=4, stacked on DEPTH-1's unchanged top_k=2 + DEPTH-2
# k=4): decode 0.80 tok/s both runs (vs 0.84-0.87 baseline), cache hit
# 56.0%/56.3% (vs 64-69%). Root cause: "Pilot RAM->VRAM promotion: ~9900
# attempted" (vs ~2000 baseline) -- user correctly suspected duplicate
# loading. CONFIRMED real: DEPTH-1 and ATTN-PILOT both predict l+1 from two
# different inputs, top-K sets routinely overlap, and each independently
# called promote_ram_to_vram for the SAME (layer,expert) within the SAME
# transition before either's async copy was confirmed landed -- a genuine
# second wasted evict_lru+upload, not a harmless re-check. FIXED via a new
# per-transition cross-pilot dedup (execution_layer.cpp's vram_promoted_
# this_transition / n_pilot_promote_dedup_skipped) -- confirmed working on
# real hardware, ~30% (5316-5411/17491-17682) of raw attempts WERE genuine
# duplicates.
# Attempt 2 (this dedup fix + DEPTH-1 raised to top_k=8 "promote all" +
# this key still at 4 + DEPTH-2 k=4): removing the duplicate-attempt waste
# did NOT fix the deeper problem -- cache hit fell FURTHER, to 39-40% (two
# runs), decode 0.75-0.76 tok/s, RAM waste ~50%. The dedup fix answers "why
# was attempted-count so high" correctly; the over-promotion-VOLUME
# regression (too many low-confidence speculative promotions -> VRAM/RAM
# churn) is a separate, deeper mechanism it doesn't touch -- see
# ram_vram_promote_top_k's own comment (reverted to 2 separately).
# REVERTED to 0/off after attempts 1-2.
# Attempt 3 (this key=2, DEPTH-1's ram_vram_promote_top_k HELD at its own
# settled 2 -- not raised this time -- + DEPTH-2 k=4): the conservative
# retry flagged after attempt 2 -- isolates whether a SMALL
# attn_pilot_vram_promote_top_k alone, without also blowing up DEPTH-1's
# own volume, behaves differently. Relies on the same cross-pilot dedup
# fix from attempt 2 (n_pilot_promote_dedup_skipped) so DEPTH-1's own
# top-2 promotion naturally skips anything ATTN-PILOT's top-2 already
# promoted this transition, regardless of which of the two blocks runs
# first in execution_layer.cpp (the dedup is symmetric -- whichever runs
# first "wins" a shared pick, the other is skipped either way) -- exactly
# the "DEPTH-1: top-2 again, if not loaded by ATTN-PILOT" semantics
# requested, no code change needed beyond the dedup already shipped.
# RESULT (3 runs): decode 0.88/0.88/0.83 tok/s (mean 0.863), cache hit
# 64%/-/- (one run logged), promotion attempted 3322-3659 with 2254-2549
# (~68-70%) caught by cross-pilot dedup, RAM waste 24.1-29.0% (elevated vs
# the ~11-12% single-source baseline, but far from attempts 1/2's 40-50%).
# NOT a regression -- unlike attempts 1/2, every run landed at or inside
# the established 0.84-0.87 baseline band, no run fell dramatically below
# it. But not a clearly confirmed win either: run 3 (0.83) sits at the
# baseline band's low edge, not above it, so the two 0.88 runs could be
# this hardware's own known run-to-run noise rather than a real uplift.
# REVERTED to 0/off, same "promising, not yet decisive" status as the
# plain ATTN-PILOT hint-push test above -- more runs (or a longer/
# different prompt, per this session's own standing caution about
# single-prompt conclusions) needed before treating either as settled.
# Attempt 4: this key=1 (even more conservative than attempt 3's 2),
# DEPTH-1 still held at its own settled top-2, DEPTH-2 top-4 unchanged.
# RESULT (3 runs): decode 0.85/0.85/0.84 tok/s (mean 0.847) -- tighter and
# MORE consistent than attempt 3's 0.88/0.88/0.83, but this time landing
# dead-center of the 0.84-0.87 baseline band rather than at/above its top.
# cache=63% hit (one run logged), promotion attempted 3059-3203 with
# 1218-1341 (~40-42%) caught by cross-pilot dedup (lower dedup fraction
# than attempt 3's ~68-70%, as expected -- ATTN-PILOT's own promotion pool
# shrank from top-2 to top-1, so less of it overlaps DEPTH-1's own top-2),
# RAM waste 26.2-27.8% -- essentially unchanged from attempt 3's 24.1-29.0%
# despite the smaller VRAM-promotion cutoff, because RAM waste here is
# driven mainly by the RAM-hint-push volume (DEPTH-2 top-4 + ATTN-PILOT's
# k=8 wide push), which is identical between attempts 3 and 4 -- only the
# VRAM promotion cutoff differs. Zero errors, not a regression. REVERTED
# to 0/off. Between attempts 3 and 4, neither shows a clear win over
# baseline; attempt 3's two 0.88 runs are the closest either got to a real
# uplift, but its own third run (0.83) already showed that band isn't
# fully separated from noise either. No further narrowing of THIS knob
# alone looks likely to resolve the ambiguity -- more runs of whichever
# variant, or a longer/different prompt, would be needed, not a smaller
# top_k.
attn_pilot_vram_promote_top_k = 0

decode_async_prewarm = true
# decode_async_prewarm_nonblocking (2026-08-28): removes decode_async_
# prewarm's own last blocking cudaStreamSynchronize (sync_active_layer_
# batch), letting find_active_expert's already-proven poll-before-trust
# check resolve completion instead (0.0% "not ready" across dozens of real
# runs on the speculative-fill path that already uses it). Direct response
# to a user challenge: correctly prefetching more experts wasn't moving
# decode throughput at all, and neither disk nor PCIe were anywhere near
# saturated -- pointing at CPU-thread SERIALIZATION (blocking on a sync
# call with nothing else to do meanwhile), not bandwidth, as the real
# bottleneck. VERIFIED ON REAL HARDWARE (2026-08-28), mechanism confirmed
# correct but throughput-NEUTRAL, not a win: active_layer_prewarm_sync
# collapsed exactly as designed (4.65-4.70s -> ~1.0s, the residual being
# prefill's own separate Phase-2 warm-up, unaffected by this flag), and the
# new n_active_layer_poll_not_ready_decode_prewarm/_speculative split
# confirmed the mechanism engages safely (500/~11500 decode_async_prewarm
# issues, ~4%, found their DMA still in-flight at use time and correctly
# fell through to a miss rather than corrupting anything; 0 from the
# speculative path, as expected given its much longer lead time). A/B (3
# runs each) on the CORRECTED decode-only rate (request_wall - prefill_wall
# -- [REQUEST]'s own printed tok/s is a BLENDED prefill+decode figure, see
# the correction below and its own memory-file entry): on=0.888/0.852/0.862
# (mean 0.867), off=0.877/0.883/0.870 (mean 0.877) -- still a clean wash,
# not a win, but NOT the alarming "whole session regressed" finding first
# suspected (that was a metric-reading bug on my part, not a real hardware
# issue -- the CPU-frequency/turbo tangent chased in that first pass was a
# phantom, disregard it). Kept ON anyway (real, safe, zero-downside
# improvement -- removes a genuinely unnecessary blocking wait), but this
# did NOT explain the user's original "prefetching doesn't move the decode-
# rate needle" complaint, which is still open. See CLAUDE.md and
# prefetch-pilot-k-8-decode-win.md's Follow-up 25 + its correction for the
# full writeup.
decode_async_prewarm_nonblocking = true
# decode_async_prewarm_max_batch: real A/B tested at 6 (2026-08-19, vs the
# default 3) specifically to see whether fewer/larger sync chunks amortize
# active_layer_prewarm_issue's cost (the single largest decode bucket,
# ~16-17s/req). No benefit: decode stayed at 0.85 tok/s (same band as
# max_batch=3), sync= dropped 1.79->1.25s as expected (fewer barriers) but
# issue= rose slightly (16.0->17.3s) -- a wash. Confirms issue= is bytes-
# bound, not call-count-bound (consistent with the two earlier reverted
# pinning/bounce-pool attempts at this same call site, see gpu_topology.hpp's
# own comment). Left at the default (3).

# Was 4096/16 for the quick pin_topk_per_layer A/B test referenced below.
# Restored to real generation lengths -- adjust to your actual workload.
context_size   = 4096
max_new_tokens = 40   # 2048
temperature    = 0.0
top_p          = 0.95
# drop_pages=true is REQUIRED here, not optional tuning: the primary model
# copy above lives on btrfs (/home), and btrfs's O_DIRECT read path silently
# falls back to buffered I/O for a real fraction of expert reads (COW/
# checksum handling, extent-boundary crossings on this file's 616 extents) --
# despite direct_io=true/io_uring=true being fully enabled and startup
# confirming "[DIRECT-IO] Enabled on 6/6 shard(s)". Measured on real hardware:
# with this off, the OS page cache for just the primary shards grows to
# ~19-20GB over a single short run (matches [Inactive(file)]/[Cached] in
# /proc/meminfo almost exactly -- confirmed via `fincore --bytes` per shard)
# and never shrinks on its own. The mirror copy (xfs, /data) shows ZERO bytes
# resident under the identical read pattern -- xfs's O_DIRECT has no such
# fallback, so this is a btrfs-specific gap, not a general O_DIRECT/io_uring
# issue. With this flag on, io_uring_backend.hpp's Ring::submit_and_wait
# fadvise(DONTNEED)s every completed read's real on-disk range immediately,
# holding primary-shard residency to ~2GB/run instead -- see
# io_uring_backend.hpp's own comment on submit_and_wait for the fix (it used
# to only cover the plain-pread fallback path, missing io_uring entirely,
# which is why an EARLIER attempt at this same flag looked like a no-op).
# See memory: btrfs-odirect-page-cache-leak.
drop_pages     = true
direct_io      = true
io_uring       = true

