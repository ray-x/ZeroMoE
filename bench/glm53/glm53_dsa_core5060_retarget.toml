# Does this "pin" WHICH experts are protected, the way pinned_vram_capacity/
# pin_strategy does below? NO -- an important distinction, easy to conflate
# given how overloaded "pin" is in this codebase. This budget only controls
# whether a RAM-tier SLOT's underlying host buffer gets cudaHostRegister'd
# (page-locked for fast async DMA) -- a one-time, per-BUFFER decision made
# the first time that slot's buffer is allocated during a session,
# completely independent of which expert IDENTITY currently occupies it.
# The RAM tier's own eviction/replacement policy (RAMSafetyManager::
# eviction_score, recency+frequency) is COMPLETELY UNAFFECTED by this
# setting -- "no pinning exists for this [RAM] tier" (see the [CACHE-CHURN]
# Host RAM tier log line's own wording) is still exactly true regardless of
# this value. A pinned slot keeps getting evicted/refilled with whatever
# expert is currently hot, exactly like an unpinned one -- pinning only
# changes whether the DMA INTO that slot is fast (cudaHostRegister'd) or
# pays a hidden synchronous pageable-staging cost every time. So a long-
# running session where popularity DRIFTS over time is NOT blocked by this
# setting -- the underlying cache adapts freely regardless of pin coverage.
#
# The setting that DOES lock in a fixed, startup-computed notion of
# "important" and does NOT re-evaluate mid-session is pinned_vram_capacity/
# pin_strategy=global_topn (VRAM's 1000-expert permanent tier, ranked once
# from .zeromoe_usage at startup, never revisited during the session) --
# THAT is the real lever to revisit if long-running popularity drift is the
# concern, not this one. See pinned_vram_capacity's own comment.
