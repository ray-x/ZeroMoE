# NOTE (2026-09-02) -- WUV int8 storage, env toggle, NOT a config key:
#   ZEROMOE_WUV_INT8=1 ./build/zeromoe --config ...
# Stores the score down-projection (WUV) weights as int8 + per-row scale
# instead of BF16, ~halving their per-layer VRAM cost. WUV loses the contest
# for this budget against qabsorb and the KV mirror, so halving it roughly
# DOUBLES how many layers get a GPU down-projection (measured 18/78 -> 35/78
# on GLM-5.3) and cuts the score= bucket ~8%. Whole-request throughput is
# FLAT though, so it is deliberately off by default -- score= is only ~4.7%
# of a request that is ~85% expert streaming. Turn it on when VRAM is the
# binding constraint (a bigger model, a tighter card, or if you want the
# freed ~150MB for the mirror / expert cache instead); leave it off
# otherwise, since int8 costs real accuracy for a saving you cannot measure
# end-to-end. Full write-up: wuv_int8_enabled() in src/attention_layer.cpp.
# attn_score_gpu_max_context: real production run showed this GPU
# (CoreEngine, RTX 5060 Ti) only had 1.82GB free at this point in startup --
# qabsorb_gpu (0.98GB) + the UNCAPPED mirror at context_size=4096 (0.74GB)
# left only 0.10GB for WUV's own 1.22GB need (78 layers), so only 6/78
# layers got WUV coverage (see CLAUDE.md for the full writeup). Capping the
# mirror to 512 tokens instead of the full 4096 frees most of that VRAM for
# WUV WITHOUT reducing the model's real context_size -- the score GPU path
# just falls back to CPU (correctness-safe, already-tested) for any decode
# position beyond 512. Real ceiling on WUV coverage while qabsorb_gpu stays
# enabled is ~50/78 layers (64%) even at cap=0 -- WUV's own footprint alone
# already exceeds what's left after qabsorb. At cap=512: ~44/78 (57%),
# chosen to comfortably cover a short-to-medium conversation (this config's
# own test prompt only reaches ~50 tokens of context) while staying close
# to that ceiling. Watch the startup "[MLA] WUV BF16 GPU fast-path: N/78"
# line -- if real usage needs longer GPU-accelerated score coverage, raise
# this at the cost of fewer WUV-covered layers (see the tradeoff table in
# CLAUDE.md), or disable attn_qabsorb_gpu instead for full 78/78 coverage
# of both mirror and WUV with zero context cap needed at all.
attn_score_gpu_max_context = 512
