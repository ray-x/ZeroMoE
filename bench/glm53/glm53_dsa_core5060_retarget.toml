# effect either time: cache hit rate stayed flat at 66.0-66.2% (vs. the
# 65-71% baseline band) despite up to 12.9% more main-cache capacity, and
# active_layer_prewarm_issue (the bucket this was meant to shrink, by
# reducing how much data ever needs to cross it) didn't move (16.1-16.5s,
# same band as the untouched baseline). Conclusion: this workload's expert
# access pattern isn't gated by marginal main-cache-size growth in this
# range -- the reactive+pinned pool already captures whatever locality
# exists at this scale; a closed lever, not just an untried one. Reverted
# to the original, well-margined 256/19.5 rather than keeping the more
# aggressive, less-margined split for zero measured benefit -- a single
# short (40-token) test prompt shouldn't be trusted to generalize a smaller
# active-layer safety margin to longer/different prompts with more diverse
# per-token miss patterns. See CLAUDE.md's 2026-08-19 entry.
active_layer_capacity = 256        # Active layer workspace size for current-layer experts
use_active_layer_area = true       # Enable temporary layer area (prevents LRU eviction)
# Promote an active-layer expert into the real VRAM LRU cache (D2D copy)
# once it's re-accessed this many times while resident, instead of just
# being freed when its layer's window closes. This whole promotion path
# (and the hit-counting it depends on) didn't exist before -- the active
# layer area used to be a pure temporary hold-and-discard buffer, and
# n_active_layer_hits was never incremented anywhere, so 0 was expected
# regardless of how often it was actually being used.
active_layer_promote_hit_threshold = 1

# 2026-08-27, REAL ROOT CAUSE FOUND AND FIXED -- SETTLED ON. Redirects
# DEPTH-1/ATTN-PILOT's speculative one-layer-ahead RAM->VRAM promotion into
# the active-layer pool instead of the main VRAM cache. 2026-08-26 closed
# with this OFF (real cache-hit gain, ~1.6-2% throughput cost blamed on
# "genuine hardware bandwidth saturation" -- see the 2026-08-26 CLAUDE.md
# entries for that full, now-superseded investigation). User pushback
# (correctly identifying that baseline pays the same speculative-promotion
# "waste" too, and that the same bytes transfer either way) forced tracing
# the ACTUAL mechanism instead of accepting the hardware-bound conclusion:
# upload_expert_async (main-cache path, what the baseline's OWN dynamic-
# layer promotion uses) ALWAYS ensures its source is pinned before DMA
# (already-persistently-pinned, or a cheap transient cudaHostRegister
# fallback) -- genuinely async every time. upload_expert_active_async (the
# active-layer path this feature and decode_async_prewarm both use) has
# NEITHER -- a transient-register attempt was tried here once before and
# reverted (too much per-call overhead at this call site's volume), so it
# was left with NO fallback at all: only genuinely async when the source
# happens to already fall inside ram_pinned_budget_gb's persistent-pin
# budget, secretly synchronous otherwise. Real measured coverage at
# ram_pinned_budget_gb=30: only 29.6% of upload_expert_active_async calls
# were covered (vs. main-cache's effectively ~100%, register fallback
# included) -- THIS gap, not "more transfers" or "hardware saturation",
# was the real cost. Raised ram_pinned_budget_gb 30->45 (a moderate step,
# not the 60 already shown to cause real host-RAM pressure in an earlier
# session -- re-verified clean at 45: pgmajfault delta 0, MemAvailable's
# one brief low sample is a transient load-time dip, not sustained
# pressure) -- coverage jumped to 46-47% overall, 54.7% for the
# speculative-fill population specifically. REAL RESULT, 4 real hardware
# runs: decode 0.87/0.88/0.86/0.87 (mean 0.87) -- matches or slightly
# BEATS the old baseline's own mean (0.857-0.865), while KEEPING the full
# cache-hit advantage (72.3-73.3% vs baseline's 65-68%). Zero errors, zero
# poll-not-ready, zero memory-pressure regression across every run.
# SETTLED ON as the live default -- see CLAUDE.md's 2026-08-27 entry for
# the complete writeup and the new coverage-measurement counters
# (n_active_layer_upload_src_pinned/_unpinned, n_speculative_fill_src_
# pinned/_unpinned, perf_timer.hpp) that made this diagnosable directly
# instead of inferred.
# 2026-08-28: ActiveLayerUploadWorkers -- background worker threads take
# unpinned-source active-layer H2D uploads (cudaMemcpyAsync) off the decode
# thread. Real root cause of a genuine hardware crash (NVRM Xid 31 MMU
# fault) FOUND AND FIXED -- see active_layer_upload_workers.hpp's own
# header comment for the full investigation. Short version: this pool used
# to also call cudaHostRegister/cudaHostUnregister per transfer; that call
# could run genuinely concurrently with ensure_slab_capacity's own
# persistent-pin cudaHostRegister (a DIFFERENT lock, ram_mutex not
# cache_mutex), and doing so at real volume under this box's own tight
# host-memory budget is judged the trigger. Fixed by removing cudaHost
# Register from this pool entirely -- every transfer is now a plain
# unpinned cudaMemcpyAsync. VERIFIED ON REAL HARDWARE across 4 separate
# multi-prompt sessions (three 2-prompt, one 3-prompt) after the fix: zero
# [ERROR] lines, zero new Xid faults, every time -- the exact scenario
# that crashed 4/4 times before the fix. Decode-only throughput (correct
# metric, NOT the [REQUEST] line's combined rate) landed at 0.884 tok/s in
# a follow-up check, matching/slightly exceeding the historical 0.86-0.88
# band.
active_layer_upload_worker_threads = 2
speculative_promote_to_active_layer = true
