move_on_promotion = false
# ram_copy_reclaim_threshold's own proactive threshold-based reclaim IS
# gated !move_on_promotion (ram_manager.hpp), so it's correctly a no-op
# here. BUT the comment that used to sit here ("moot while move_on_
