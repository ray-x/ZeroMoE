# EXPERIMENTAL MiMo V2.6 Flash correctness profile: native bounded DDR/VRAM
# expert caches, no second
# graph-owned expert arena. Raise context/batching only after parity validation.
model_path = "/path/to/model-or-shard-directory"
context_size = 2048
max_new_tokens = 16
temperature = 0.0
top_p = 1.0
enable_thinking = false
reasoning_effort = "low"
spec_type = "none"
prompt_cache = false
log_level = "INFO"

host_ram_gb = 80.0
ram_pinned_budget_gb = 2.0
ram_preload_all_experts = false
freeze_usage_stats = false
pin_file = ".zeromoe_usage_mimo26_gsq_rco3"
prefill_pin_file = ".zeromoe_usage_prefill_mimo26_gsq_rco3"
pin_topk_per_layer = 0
pinned_vram_capacity = 0
pin_strategy = "global_topn"

direct_io = false
io_uring = true
drop_pages = true
omp_max_threads = 6
attn_score_threads = 6
expert_fetch_threads = 4
prefetch_worker_threads = 2
prefill_batch_tokens = 16
moe_prefill_batched = true
expert_gpu_activation = true
moe_gpu_accum = true
glm5next_router_gpu = false
use_active_layer_area = true
active_layer_capacity = 16
active_layer_promote_hit_threshold = 1
active_layer_upload_worker_threads = 1
move_on_promotion = true

[[gpus]]
device_id = 0
name = "NVIDIA GeForce RTX 3090"
role = "dense+moe"
vram_gb = 24.0
kv_cache_gb = 1.0
dense_gb = 7.0
moe_cache_gb = 8.0
active_layer_weight = 1
active_layer_capacity_slots = 16

[[gpus]]
device_id = 1
name = "NVIDIA GeForce RTX 5060 Ti"
role = "moe"
vram_gb = 16.0
kv_cache_gb = 0.0
dense_gb = 0.0
moe_cache_gb = 12.0
active_layer_weight = 1
active_layer_capacity_slots = 16
