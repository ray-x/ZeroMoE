# Option B: 44 usage-concentrated layers at 50% expert residency.
#
# The Qwen model has 48 MoE layers and 512 experts per layer.  This profile
# uses the 106-prompt histogram to select layers whose top 256 experts cover
# at least 90% of historical routing traffic, ranks those layers by coverage,
# and keeps the best 44.  The remaining four layers stay CPU/DDR-backed.
#
# 44 * 256 experts is the same expert-count budget as 22 complete layers.
# qwen4exp_option_b_fill_vram is intentionally false so this first A/B run
# measures the requested fixed 50% placement without filling the remaining
# arena opportunistically.

model_path = "/path/to/model-or-shard-directory"
cpu_affinity_layers = []
log_path = "logs/qwen4exp_option_b_44layers_106usage.log"
log_level = "INFO"

context_size = 2048
max_new_tokens = 80
temperature = 0.0
top_p = 0.95
raw_prompt = false
enable_thinking = false

direct_io = false
io_uring = false
drop_pages = true

# Keep all experts available in the fixed-stride DDR arena.  Option B places
# only the selected hot experts in the full-graph CUDA arena.
host_ram_gb = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
pinned_vram_capacity = 128
expert_fetch_threads = 10
omp_max_threads = 12
prefetch_worker_threads = 4

# The 106-prompt Qwen decode histogram is the sole ranking source.  An empty
# prefill_pin_file makes the loader fall back to pin_file rather than using a
# stale 7-prompt prefill histogram.
pin_file = ".zeromoe_usage_qwen4exp_106prompts_100tokens"
prefill_pin_file = ""
freeze_usage_stats = true

qwen4exp_option_b_layer = -1
qwen4exp_option_b_concentrated_only = true
qwen4exp_option_b_top_n = 256
qwen4exp_option_b_min_coverage = 0.90
qwen4exp_option_b_max_layers = 44
qwen4exp_option_b_fill_vram = false
qwen4exp_option_b_stage_expert = -1
qwen4exp_option_b_stage_count = 1

qwen4exp_full_graph = true
qwen4exp_full_graph_decode = true
qwen4exp_cpu_gpu_overlap = true
qwen4exp_cpu_gpu_overlap_max_layers = 0
qwen4exp_decode_device_hc = true
qwen4exp_decode_gpu_router = false
qwen4exp_decode_ggml_moe = true
qwen4exp_cpu_ggml_moe = true
qwen4exp_cpu_strided_grouped = true
qwen4exp_cpu_fused_grouped = true
qwen4exp_cpu_shared_device = true

moe_ggml_mul_mat_id = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_gpu_router = true
moe_ggml_device = 0
hc_ggml = true
gdn_full_ggml = true
qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true
moe_gpu_accum = true
expert_gpu_activation = true

use_active_layer_area = true
active_layer_capacity = 10
decode_async_prewarm = false
prefetch_pilot_depth = 1
prefetch_pilot_k = 10
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.9

[[gpus]]
device_id = 0
name = "RTX 3090"
role = "dense+moe"
dense_gb = 4.1
kv_cache_gb = 2.0
# The static Option-B arena owns the 44 * 256 hot experts.  Keep only a
# small legacy decode fallback cache so it does not consume the VRAM needed
# by that arena; cold experts are supplied from the preloaded DDR tier.
moe_cache_gb = 0.25
kv_bits = 4
