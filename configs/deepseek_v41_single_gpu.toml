# DeepSeek-V4.1-Flash Q2_K smoke/runtime profile.
# The model directory contains the seven GGUF shards on the local NVMe drive;
# V4.1 is selected from GGUF metadata.
model_path = "/home/ray/vllm-workspace/DeepSeek-V41-Flash"
log_level = "INFO"
context_size = 1024
max_new_tokens = 40
temperature = 0.0
top_p = 1.0
drop_pages = false
# direct_io: enabled now that all 7 shards were repacked to 4096-byte
# alignment (2026-09-12) -- the original download had general.alignment=32,
# which forced O_DIRECT off for every shard regardless of this setting (see
# the startup [ALIGN-WARN] this used to print). io_uring left off for now to
# isolate this change's own effect before layering another variable on top.
direct_io = false
io_uring = false
host_ram_gb = 80.0
# Usage history is model-specific learned state.  The first run creates these
# files at shutdown; later runs use them for ranked preload.
freeze_usage_stats = false
pin_file = "/home/ray/Projects/MoEStream/.moestream_deepseek-v41_usage"
prefill_pin_file = "/home/ray/Projects/MoEStream/.moestream_deepseek-v41_usage_prefill"
pin_topk_per_layer = 0
pin_vram_lru_fraction = 0.25
pin_ram_fraction = 0.50
pinned_vram_capacity = 1024
prefetch_worker_threads = 4
expert_fetch_threads = 8
promote_hit_threshold = 2
pin_threshold = 0
active_layer_capacity = 64
use_active_layer_area = true
move_on_promotion = true

[[gpus]]
device_id = 0
name = "NVIDIA GeForce RTX 3090"
role = "dense+moe"
vram_gb = 24.0
dense_gb = 3.5
kv_cache_gb = 2.0
kv_bits = 4
moe_cache_gb = 18.0
