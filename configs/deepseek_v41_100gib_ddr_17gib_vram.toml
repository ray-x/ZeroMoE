# DeepSeek-V4.1-Flash: up to about 100 GB decimal DDR expert capacity and a requested
# 17 GiB expert VRAM pool on the RTX 3090. Allocation keys use decimal GB.
# 8360 expert slabs at 12,810,240 bytes each = 99.739 GiB maximum.
# 107 GB host budget includes dense/state/scratch and preserves a 20 GiB
# physical-memory floor. Capacity is bounded by RAM admission and fills on demand.
# With ZEROMOE_DEEPSEEK_V41_FULL_GRAPH_DECODE=1, the existing 6 GiB graph
# reserve should allow the 17 GiB pool on an idle RTX 3090; inspect
# startup's actual allocated cache size. Keep admission checks enabled.
# Decode borrows the existing expert caches; graph-owned MoE weight bytes=0.

model_path = "/home/ray/vllm-workspace/DeepSeek-V41-Flash"
log_level = "INFO"
context_size = 1024
max_new_tokens = 40
temperature = 0.0
top_p = 1.0
prompt_cache = false
drop_pages = false
direct_io = true
io_uring = true
host_ram_gb = 107.0
ram_cache_total_experts = 8360
ram_pinned_budget_gb = 15.0
freeze_usage_stats = true
pin_file = "/home/ray/Projects/ZeroMoE/.zeromoe_deepseek-v41_usage"
prefill_pin_file = "/home/ray/Projects/ZeroMoE/.zeromoe_deepseek-v41_usage_prefill"
cpu_affinity_layers = []
ram_cache_layer_adaptive = false
moe_ggml_mul_mat_id = false
pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
pin_topk_per_layer = 0
pin_vram_lru_fraction = 0.25
pin_ram_fraction = 0.50
pinned_vram_capacity = 1024
prefetch_worker_threads = 4
expert_fetch_threads = 8
prefetch_attn_pilot = false
prefetch_pilot_k_adaptive = true
prefetch_pilot_k_adaptive_threshold = 0.50
prefetch_pilot_k_adaptive_min_samples = 30
promote_hit_threshold = 3
pin_threshold = 8
active_layer_capacity = 64
use_active_layer_area = true
move_on_promotion = true
expert_gpu_activation = false
active_layer_upload_worker_threads = 2
ram_vram_promote_top_k = 2
ram_vram_promote_layer_gate = true
ram_vram_promote_layer_gate_threshold = 0.65
ram_vram_promote_layer_gate_min_samples = 30
ram_vram_promote_layer_gate_top_fraction = 0.3
speculative_promote_to_active_layer = true
ram_vram_promote_adaptive = false
vram_evict_demote_to_ram = false

