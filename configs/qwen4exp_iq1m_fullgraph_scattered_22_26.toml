# IQ1_M scatter-placement comparison: the same 26 CPU / 22 GPU expert layers
# as beellama's historical scattered mask. Launch with:
#   ZEROMOE_QWEN4EXP_FULL_GRAPH=1
#   ZEROMOE_QWEN4EXP_FULL_GRAPH_DECODE=1
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_LAYERS=40
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_TRAILING=1
# The candidate GPU range is [8,48); cpu_affinity_layers excludes the 18
# scattered CPU layers inside it, leaving the same 22 GPU layers as the mask.
model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M/Qwen3.8-Flash-Next-UD-IQ1_M-00001-of-00003.gguf"

cpu_affinity_layers = [0, 1, 2, 3, 4, 5, 6, 7, 14, 20, 21, 22, 24, 28, 30, 33, 34, 36, 38, 40, 41, 42, 43, 44, 45, 46]
log_path = "/tmp/qwen4exp_iq1m_fullgraph_scattered_22_26.log"
log_level = "INFO"

context_size = 2048
max_new_tokens = 40
temperature = 0.0
top_p = 0.95
raw_prompt = false
enable_thinking = false

direct_io = false
io_uring = false
drop_pages = true

host_ram_gb = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
pinned_vram_capacity = 128
expert_fetch_threads = 10
omp_max_threads = 12
prefetch_worker_threads = 4

pin_file = "tests/moe_usage_survey/zeromoe_usage_survey_qwen4exp_usage_tap"
prefill_pin_file = "tests/moe_usage_survey/zeromoe_usage_survey_prefill"
freeze_usage_stats = true

qwen4exp_option_b_layer = -1
qwen4exp_option_b_top_n = 256
qwen4exp_option_b_min_coverage = 0.80
qwen4exp_option_b_stage_expert = -1
qwen4exp_option_b_stage_count = 1

qwen4exp_full_graph = true
qwen4exp_full_graph_decode = true
qwen4exp_cpu_gpu_overlap = true
qwen4exp_cpu_gpu_overlap_max_layers = 0

qwen4exp_decode_device_hc = true
qwen4exp_decode_gpu_router = false
qwen4exp_decode_ggml_moe = true
qwen4exp_cpu_ggml_moe = true
# Retained from the reference profile. These grouped CPU flags serve legacy
# token dispatch; full-graph CPU nodes execute through the GGML CPU scheduler.
qwen4exp_cpu_strided_grouped = true
qwen4exp_cpu_fused_grouped = true
moe_ggml_mul_mat_id = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_gpu_router = true
moe_ggml_device = 0
qwen4exp_cpu_shared_device = true
hc_ggml = true
gdn_full_ggml = true
gdn_proj_ggml = true
qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true
moe_gpu_accum = true
expert_gpu_activation = true

use_active_layer_area = true
active_layer_capacity = 10
decode_async_prewarm = false
prefetch_pilot_depth = 1
prefetch_pilot_k = 10
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.9

[[gpus]]
device_id = 0
name = "RTX 3090"
role = "dense+moe"
dense_gb = 4.1
kv_cache_gb = 2.0
moe_cache_gb = 11.5
kv_bits = 4
