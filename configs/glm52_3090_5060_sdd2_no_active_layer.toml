# A/B test variant of glm52_3090_5060_sdd2.toml: use_active_layer_area=false.
#
# Purpose: the 2026-08-07 perf report on the base config showed `expert=`
# time split 7.29s GPU compute / 25.91s active_up (active-layer synchronous
# H2D uploads) / 25.14s ram_scan (get_batch) -- i.e. active_up alone was
# ~36% of the whole expert-dispatch critical path, larger than compute
# itself. "Three-tier caching" in that same report showed only 903/17523
# (5.2%) active-layer uploads ever got promoted to the real VRAM cache
# (active_layer_promote_hit_threshold=1, so this is "promoted on the very
# next re-hit" already, not a threshold-tuning artifact) -- most active-
# layer fills serve exactly one dispatch before being discarded by
# cleanup_active_layer_area. Diffuse top-8/256 routing on this model
# (avg VRAM-pin concentration only ~30-34% per [PIN] logs) makes low
# within-window reuse plausible on short prompts specifically.
# UNTESTED: run this config back-to-back with the base config on the SAME
# prompt/context_size/max_new_tokens and compare decode tok/s + expert=
# breakdown. If active_up time mostly just moves into ram_scan/gpu instead
# of shrinking net expert= time, the mechanism was doing real work worth
# its cost and this variant should be discarded. If net expert= drops,
# active_layer_capacity=256 is buying little for this workload and either
# disabling it or shrinking active_layer_capacity is worth adopting.
# See CLAUDE.md's "Active Layer Area (Three-Tier Caching)" entry for what
# this mechanism is for.

model_path = "/path/to/model-or-shard-directory"
log_path = "debug.log"
log_level = "INFO"

context_size   = 4096
max_new_tokens = 40
temperature    = 0.0
top_p          = 0.95
drop_pages     = false
direct_io      = true
io_uring       = true

disk_batch_padding = true
disk_batch_padding_target = 8
host_ram_gb          = 120.0
verbose_moe_log      = false
promote_hit_threshold = 6
promote_h2d_threshold = 6

prefetch_staging_slots = 256
prefetch_worker_threads = 4
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.5
ram_cache_layer_adaptive = true
vram_evict_demote_to_ram = true
expert_fetch_threads = 8
omp_max_threads = 8

pin_file      = ".zeromoe_usage"
pin_threshold = 6
pin_topk_per_layer = 12
pin_strategy = "global_topn"
pin_global_floor_per_layer = 1

pinned_vram_capacity = 1300        # unchanged from the base config -- only variable under test is below
active_layer_capacity = 256        # unused while use_active_layer_area=false, left set for an easy revert
use_active_layer_area = false      # <-- THE VARIABLE UNDER TEST (base config has this true)
active_layer_promote_hit_threshold = 1
move_on_promotion = true

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "moe"
vram_gb      = 24.0
kv_cache_gb  = 0.0
kv_bits      = 4
dense_gb     = 0.0
moe_cache_gb = 19.5

[[gpus]]
device_id    = 1
name         = "NVIDIA GeForce RTX 5060 Ti"
role         = "dense+moe"
vram_gb      = 16.0
kv_cache_gb  = 3.0
kv_bits      = 4
dense_gb     = 12.0
moe_cache_gb = 1.3
