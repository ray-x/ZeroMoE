# MoEStream — Qwen3.6-35B-A3B-UD CPU-ONLY config for MacBook Air
#
# Model: /Users/rayxu/.lmstudio/models/Qwen/Qwen3.6-35B-A3B-UD
# Format: UD-IQ2_M (12 GB file, ~1.10 MB per routed expert slab)
#
# This config targets a MacBook Air (Apple Silicon, no CUDA).  The root
# CMakeLists.txt already forces MOESTREAM_CPU_ONLY=ON on macOS, so the engine
# will run the CPU dequant + matmul path for every layer if/when the full
# CPU-only decode path is wired up.  Until then this file documents the
# intended settings for 4 GB of host-side expert cache.
#
# Sizing notes (from `gguf_tool plan` on this file):
#   * 40 transformer layers, all 40 are MoE layers
#   * 256 experts per MoE layer
#   * Dense tensor set: ~1.5 GB (native quant) -> size dense_gb ~2.0 GB
#   * One expert slab: ~1.10 MB
#   * 4 GB of expert cache -> ~3643 slots (~91 slots/layer average)
#   * System RAM on the planning machine: 17.2 GB
#
# With only 4 GB total for the host LRU, keep the pin/preload small so the
# reactive LRU has room to respond to actual routing traffic.  A good starting
# point is pin_topk_per_layer ~2-3 (80-120 pinned experts total), leaving the
# rest of the 4 GB budget for dynamic LRU hits.

model_path = "/Users/rayxu/.lmstudio/models/Qwen/Qwen3.6-35B-A3B-UD"

context_size   = 4096
max_new_tokens = 10
temperature    = 0.0
top_p          = 0.95
drop_pages     = false

log_path = "debug.log"   # empty (default) = stderr
log_level = "VERBOSE"        # VERBOSE | DEBUG | INFO (default) | WARN | ERROR
# <<< CPU-only switch >>>  No GPU dispatch on MacBook Air.
cpu_only = true

# Total host RAM budget for the MoE expert LRU cache.  This is the 4 GB the
# user wants to allocate for the pin + LRU working set.  Leave headroom for
# the OS, the dense tensors, KV cache, and any application overhead.
host_ram_gb = 4.0

# Promote a RAM-resident expert to the (unused-on-macOS) VRAM cache only after
# this many repeated hits.  Under cpu_only this counter is effectively ignored,
# but keeping it small matches the intent of a small cache.
promote_hit_threshold = 2

# Persisted usage histogram used by startup preload to decide which experts to
# pin.  Will be created automatically on first run.
pin_file      = ".moestream_usage"
pin_threshold = 4

# Number of experts per layer to pin/preload from the usage file.  With 40 MoE
# layers this is 80 pinned experts total, using ~88 MB of the 4 GB budget.
pin_topk_per_layer = 2

# GPU entries are required by the config parser even under cpu_only.  They are
# allocated but not used for compute when cpu_only = true.  Values are minimal.

[[gpus]]
device_id    = 0
name         = "Apple Silicon (CPU-only placeholder)"
role         = "dense+moe"
vram_gb      = 0.0
dense_gb     = 0.0
kv_cache_gb  = 0.0
kv_bits      = 4
moe_cache_gb = 3.0
