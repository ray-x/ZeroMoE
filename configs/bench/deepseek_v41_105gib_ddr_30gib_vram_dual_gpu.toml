# DeepSeek-V4.1-Flash dual-GPU starter profile (context 4096, temperature 0).
# Benchmark-only profiles and measured conditions are in configs/bench/.
# Full graph is the default; see docs/deepseek_v41_decode.md.
# 3090: 17.25 GB (~16.1 GiB) main expert cache, 48 active slots, one shared dense pool.
# 5060 Ti: 13.5 GiB main expert cache and 16 active slots.
# DDR target: 13,100 expert slots (~105 GiB); the byte-aware cap also charges
# resident tensors and graph/runtime headroom. With host_ram_gb=120 GB, the
# current model's effective DDR ceiling is about 100.6 GiB. The 8 GiB reserve
# is enforced both at startup and by the live MemAvailable guard.
# host_ram_gb is the total process allocation ceiling, in decimal GB.
# Caches fill on demand. Graph-owned MoE weight bytes = 0; dense bindings alias
# the engine's persistent device pool across prefill/decode graph lifetimes.

model_path = "/mnt/usb-ssd/@/home/ray/models/DeepSeek-V4.1-Flash-1017-GSQ-RCO/DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00001-of-00006.gguf"
