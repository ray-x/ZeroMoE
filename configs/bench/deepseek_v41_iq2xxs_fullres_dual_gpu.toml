# DeepSeek V4.1 decode-ranked CPU/split profile from observed route logs.
# Loads only the route union observed in the exact CPU/split test workload.
# 160 dynamic VRAM slots remain for prefill staging and decode cache use; decode misses use CPU.
# Startup verifies every frozen manifest expert is resident in DDR or pinned VRAM.
# 3090 cache is reduced by 0.60 GB and assigned to the 5060 Ti cache,
# giving the graph/core GPU more prefill workspace while retaining pool bytes.
# Host cap 118.0 decimal GB; 4.0 GiB startup margin; 5 GiB request headroom; 4.5 GiB live floor.
# Strict full residency places every model expert in pinned VRAM or DDR before serving.
# VRAM pins use decode-only counts. Strict full-residency loads every unpinned expert into DDR; prefill stages current-prompt routes through the shared dynamic slots and then rebalances those slots for decode.
# DDR page registration is capped at 15 GB; test isolation retains DDR source copies.

