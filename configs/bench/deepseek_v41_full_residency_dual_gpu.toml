# DeepSeek V4.1 strict full-residency dual-GPU profile.
# Runtime requires explicit dynamic VRAM slots and host prefill headroom.
# 32 VRAM slots stay empty for graph uploads; their model experts stay in DDR.
# Planner checks the exact per-layer DDR complement plus 0.65 GB host headroom.
# 3090 cache is reduced by 0.60 GB and assigned to the 5060 Ti cache,
# giving the graph/core GPU more prefill workspace while retaining pool bytes.
# Host cap 123 decimal GB; startup margin 4 GiB; live allocation floor 4.5 GiB.
# The startup audit rejects this profile before requests if all 15,360 experts
# and the configured prompt headroom do not fit safely.
# Frozen five-prompt route ranking, context 4096, temperature 0.8.
# Page registration is capped at 15 GB; strict mode keeps DDR copies on promotion.

