# Option B laboratory profile, based on the master execution path.
#
# This profile intentionally uses the full Qwen graph. Layer 13 is split
# statically into a frequency-ranked GPU hot set and a DDR/CPU cold set; all
# other routed layers remain complete in the DDR graph arenas. No Phase-1
# predictive staging, mapped-pointer shim, or staging arena is enabled.

model_path = "/path/to/model-or-shard-directory"

# Preserve the baseline full-graph topology. The 22 complete GPU-resident
# layers are selected at launch with:
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_TRAILING=1
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_LAYERS=22
# The Option-B planner then adds only Layer 13's per-expert split. Do not
# populate cpu_affinity_layers here: doing so would override the baseline
# graph placement for those layers.
cpu_affinity_layers = []
log_path = "logs/qwen4exp_option_b_layer13.log"
log_level = "INFO"

context_size = 2048
max_new_tokens = 80
temperature = 0.0
top_p = 0.95
raw_prompt = false
enable_thinking = false

direct_io = false
io_uring = false
drop_pages = true

# Keep every expert in the fixed-stride host arena. The full graph aliases
# this arena for the cold branch instead of reading GGUF pages at decode.
host_ram_gb = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
pinned_vram_capacity = 128
expert_fetch_threads = 10
omp_max_threads = 12
prefetch_worker_threads = 4

pin_file = ".zeromoe_usage_qwen4exp_7prompts_isolated"
prefill_pin_file = ".zeromoe_usage_qwen4exp_prefill_7prompts_isolated"
freeze_usage_stats = true

# Option B: exactly one target layer and a static frequency-ranked hot set.
qwen4exp_option_b_layer = 13
qwen4exp_option_b_top_n = 128
qwen4exp_option_b_min_coverage = 0.80
# Disabled by default (-1): the H2D staging proof below forces cold-expert
# copies into VRAM on EVERY decode token regardless of real routing, which
# measured ~7% slower than real Option-B throughput (verified 2026-09-25,
# see fullgraph-regression-report memory) -- it's a wiring-correctness
# proof, not representative decode behavior. Set qwen4exp_option_b_stage_
# expert >= 0 explicitly to re-enable it for that proof.
#
# Single-slot Layer-13 H2D proof: expert 0 has zero historical routes in the
# isolated seven-prompt usage file and is therefore a known cold expert.
qwen4exp_option_b_stage_expert = -1
# Multi-slot H2D stress proof: select ten cold experts starting from the
# configured seed, skipping any expert already in the static hot set.
qwen4exp_option_b_stage_count = 10

# Enable the master full-graph decode path. Its split planner applies Option B
# only to Layer 13; the other layers retain the documented 22-GPU/26-CPU
# topology above.
qwen4exp_full_graph = true
qwen4exp_full_graph_decode = true
qwen4exp_cpu_gpu_overlap = true
qwen4exp_cpu_gpu_overlap_max_layers = 0

# Device-native HC/router inputs and the established Qwen graph kernels.
qwen4exp_decode_device_hc = true
# Keep only the target layer in the legacy dispatcher; the other 47 layers
# retain the master grouped decode path. The dispatcher explicitly excludes
# Layer 13 when its Option-B mask is committed.
qwen4exp_decode_gpu_router = false
qwen4exp_decode_ggml_moe = true
qwen4exp_cpu_ggml_moe = true
qwen4exp_cpu_strided_grouped = true
qwen4exp_cpu_fused_grouped = true
moe_ggml_mul_mat_id = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_gpu_router = true
moe_ggml_device = 0
qwen4exp_cpu_shared_device = true
hc_ggml = true
gdn_full_ggml = true
qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true
moe_gpu_accum = true
expert_gpu_activation = true

use_active_layer_area = true
active_layer_capacity = 10
decode_async_prewarm = false
prefetch_pilot_depth = 1
prefetch_pilot_k = 10
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.9

[[gpus]]
device_id = 0
name = "RTX 3090"
role = "dense+moe"
dense_gb = 4.1
kv_cache_gb = 2.0
moe_cache_gb = 11.5
kv_bits = 4
