# ZeroMoE — GLM-5.2 dual-GPU config (RTX 5060 Ti core + RTX 3090 vault)
#
# NOTE: UD-IQ2_M is a COMPLETE GLM-5.2 model (dense at Q5_K/Q6_K/Q8_0, routed
# experts at gate=up=IQ2_XXS / down=IQ3_XXS for 71/76 MoE layers, packed as
# *_exps -- confirmed via the runtime [QUANT] startup report, which is the
# authoritative source; a Q2_K/Q3_K claim previously written here was WRONG
# and cost real debugging time chasing the wrong dequant kernel -- always
# check the [QUANT] report for a given checkpoint rather than trusting this
# comment). Run it alone — dense_model_path is commented because UD-IQ4_XS
# on disk is a different (~13-layer) model, not GLM-5.2, which caused
# "blk.13 missing". Re-enable dense_model_path only with a matching GLM-5.2
# (79-layer) dense file.

model_path = "/path/to/model-or-shard-directory"
# dense_model_path = "/path/to/local-resource"

context_size   = 32768
max_new_tokens = 2048
temperature    = 0.7
top_p          = 0.95
drop_pages     = false

# 60 GB of your 64 GB for the MoE expert host LRU cache.
host_ram_gb          = 60.0
verbose_moe_log      = false
promote_hit_threshold = 2

# CONFIRMED: the original disable comment (kept below for history) was
# right. pin_topk_per_layer=0 (auto-fill available VRAM cache capacity) is
# the actual culprit, not pin_threshold -- a retest with pin_threshold=3
# and pin_topk_per_layer still at 0/auto pinned 1579/1642 VRAM slots (96%)
# at startup from a prior run's usage history, starving both the reactive
# cache AND the decode-time GPU-dispatch fallback of evictable room: GPU
# dispatch collapsed from 94.7% to 48.8%, CPU expert fallback became the
# single largest cost bucket (126.9s), and disk reads exploded to 133.6GB
# for just 52 tokens. Near-identical pinned count to the ORIGINAL
# regression this comment used to warn about (1575/1576 then, 1579 now) --
# same failure, confirmed reproducible.
#
# Original history, for context: across three earlier runs (pin_threshold=8,
# pin_topk_per_layer=0 the whole time), pinned-resident count rose
# 168 -> 1575 -> 1576 while cache hit rate FELL 61% -> 57% -> 44%. Leading
# theory at the time: GLM-5.2's routing here is close to flat (preloaded
# usage file's hottest expert was picked only 9 times all run), so
# auto-filling to capacity reserves most of the cache for a barely-hotter-
# than-noise top-K.
#
# Fixed by explicitly capping pin_topk_per_layer instead of leaving it at
# 0/auto -- 8/layer bounds the worst-case startup preload to ~608 slots
# (76 layers x 8) instead of nearly the whole 1642-slot cache.
pin_file      = ".zeromoe_usage"
pin_threshold = 6
pin_topk_per_layer = 8

# Three-tier VRAM caching configuration
# Eliminates 7.7GB tier overlap waste and increases pinned capacity to 1024
pinned_vram_capacity = 1024      # Maximum pinned experts (was ~600, targets colibri's 1024)
active_layer_capacity = 256        # Active layer workspace size for current-layer experts
use_active_layer_area = true       # Enable temporary layer area (prevents LRU eviction)
move_on_promotion = true          # MOVE instead of COPY on RAM→VRAM promotion (eliminates tier overlap)

log_level = "VERBOSE"

# GPU 1 (nvidia-smi): RTX 5060 Ti — Blackwell sm_120, newest arch -> CoreEngine
# (dense layers + KV cache + activations).
[[gpus]]
device_id    = 1
name         = "NVIDIA GeForce RTX 5060 Ti"
role         = "dense"
vram_gb      = 16.0
dense_gb     = 8.0
kv_cache_gb  = 5.0
kv_bits      = 4
moe_cache_gb = 0

# GPU 0 (nvidia-smi): RTX 3090 — ExpertVault (MoE expert LRU in VRAM).
[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "moe"
vram_gb      = 24.0
moe_cache_gb = 23.0
