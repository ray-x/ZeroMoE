# Qwen3.8-Flash-Next (GGUF arch "qwen4exp") -- hybrid Gated DeltaNet
# (recurrent) + full-attention layers, low-rank hyper-connections, PLE
# n-gram embedding, 512-expert MoE.
#
# INITIAL DRAFT, UNVERIFIED ON REAL HARDWARE (new model-family bring-up):
# resource sizing below is a starting guess cloned from the GLM5Next config,
# NOT a tuned profile. Verify with a known prompt before trusting output;
# see CLAUDE.md's debugging/tensor-tracing section (trace_filter /
# trace_abort_on_nan) for the bring-up workflow.
#
# Family-specific notes:
#  - v1 runs full-attention layers DENSE over the whole KV cache: the QSA
#    sparse-attention indexer (indexer.* tensors, attention.compress_ratios)
#    is loaded + logged at startup but not executed yet.
#  - The PLE gather table (per_layer_token_embd.weight) is NOT RAM-preloaded
#    -- rows are gathered on demand out of an mmap'd shard (MADV_RANDOM).
#  - There is no output_norm tensor; the low-rank HC output mixer
#    (output_hc_*) is the final norm.
#  - MoE routing: softmax gating + a sigmoid-gated shared expert
#    (ffn_gate_inp_shexp); 512 experts, top-10.

model_path = "/path/to/model-or-shard-directory"
# mirror_model_path = ""   # optional second-drive copy (striped reads)

log_path = "debug.log"
log_level = "INFO"

context_size   = 256
max_new_tokens = 16
temperature    = 0.7
top_p          = 0.95
enable_thinking = false

# Routing-history preload/pin files (see CLAUDE.md; created on first run)
host_ram_gb = 1.0
pin_topk_per_layer = 0
expert_fetch_threads = 2
omp_max_threads = 4
pin_file    = ""
freeze_usage_stats = false

# system_prompt = ""       # optional ChatML system turn

# CPU-only Mac starting point: keep the host expert LRU near 1 GB and avoid
# pin-file preload. The first shard path is explicit; GGUF load_header discovers
# sibling shards automatically.
[[gpus]]
device_id    = 0
name         = "GPU 0"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 6.0
kv_cache_gb  = 1.0
kv_bits      = 4
moe_cache_gb = 14.0
