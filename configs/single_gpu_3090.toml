# ZeroMoE — GLM-5.2 single-GPU config (RTX 3090 only, dense+moe combined)
#
# For when only one GPU is physically available -- unlike
# glm52_3090_5060.toml's split (a full separate card dedicated to the
# expert-cache vault, ~92% of wall time), here dense tensors, KV cache,
# active-layer buffer, AND the expert cache all have to share the SAME
# 24GB card. Read this before assuming this will match dual-GPU throughput:
# it structurally can't, and that's arithmetic, not a bug -- see below.
#
# BUG FIXED (src/main.cpp) to make this config viable at all: role=
# "dense+moe" puts this device in BOTH dense_gpu_idx and vault_gpus
# (engine_config.hpp's validate()), so the MAIN allocate_expert_cache() pass
# gives it its full configured moe_cache_gb FIRST, before dense
# offload/BF16 ever runs -- good. But a SEPARATE code path
# (add_dual_role_expert_cache, meant only for a CoreEngine-ONLY device with
# a supplementary slice) used to ALSO fire for this exact "dense+moe"
# single-GPU case, and worse, the attn_output BF16 fast-path's budget
# calculation had zero awareness that a same-device moe_cache_gb slice was
# coming -- so on a card with generous headroom (like this one), BF16 would
# greedily convert every layer it could (a real run: all 78 layers, 15.7 GB)
# BEFORE the slice's turn, leaving moe_cache_gb crushed to a rounding error
# (0.39 GB actually allocated, regardless of the 8.5-9.5 GB requested).
# Fixed by (1) reserving room for a PENDING same-device slice before
# computing the BF16 budget (only when the device ISN'T already a primary
# vault), and (2) skipping the redundant add_dual_role_expert_cache call
# entirely when the device is already a primary vault (true single-GPU
# dense+moe already got its full moe_cache_gb up front from the main path --
# firing this again just wastes a cudaMalloc attempt and logs a confusing
# "skipped" line). UNVERIFIED ON REAL HARDWARE -- this Mac dev box can't
# compile CUDA at all (see CLAUDE.md's Mac workflow section); only
# clang-check/reviewed by eye. Verify for real on the Linux/CUDA box before
# trusting: watch for "[GPU] Expert cache on ... (moe_cache_gb enforced)"
# reporting close to the moe_cache_gb value below (not a rounding error),
# and confirm NO "[GPU] Dual-role expert cache ... skipped" line appears
# right after it (that would mean the guard didn't match).
#
# THE HONEST CEILING: even with that fix, dense (~13 GB worst-case, covers
# every attn_output layer NOT BF16-converted) + KV cache (3 GB) + the
# active-layer buffer (128 slots here, ~1.9 GB) already claim ~18 GB of this
# card's ~25 GB real headroom before the expert cache gets a turn --
# leaving only ~6 GB / ~400 slots for the pool that handles ~92% of wall
# time, vs ~1500+ slots when a full second card is dedicated to it in
# glm52_3090_5060.toml. Expect a noticeably lower cache hit rate and lower
# throughput than that dual-GPU config -- this file makes single-GPU
# dense+moe WORK CORRECTLY (moe_cache_gb is no longer silently nullified),
# not FAST. If a second GPU is ever available, prefer the dual-GPU config.

model_path = "/data/models/GLM-5.2-GGUF/UD-IQ2_M"
log_path = "debug_single_3090.log"
log_level = "DEBUG"

context_size   = 32768
max_new_tokens = 40
temperature    = 0.7
top_p          = 0.95
drop_pages     = false
direct_io      = true
io_uring       = true

# Same safety cuts as glm52_3090_5060.toml -- see that file's / CLAUDE.md's
# host_ram_gb entry for the real workstation-freeze incident this avoids.
host_ram_gb            = 45.0
prefetch_staging_slots = 128
verbose_moe_log        = false
promote_hit_threshold  = 2

pin_file      = ".zeromoe_usage"
pin_threshold = 6
# Sized against the ~400-slot pool this config's moe_cache_gb (6.0 GB /
# ~14.75 MB per expert slab) is expected to produce -- 3/layer x 75 layers =
# 225 (~56% of ~400), a moderate fraction given this session's own history
# showed BOTH "more pinning hurts on a thin usage history" (52.3% vs 53.4%
# at 13 vs 8/layer) AND "more pinning helps on a richer one" (50.9% at 82%
# pinned) at different points -- and a MUCH bigger, sharper failure mode
# than either: pinned_vram_capacity exceeding the pool entirely floods
# "evict_lru found NO victim" for the whole run (confirmed on a real run,
# cache_cap=704 vs pinned target 825 -- see CLAUDE.md). ALWAYS re-check
# pin_topk_per_layer x total_layers against the actual "[GPU] Expert VRAM
# cache: N slots" line in the first real run on this config and adjust
# downward if it's anywhere close to N -- this pool is small enough that
# overshooting is easy and costly.
pin_topk_per_layer   = 3
pinned_vram_capacity = 225       # 3/layer x 75 layers, ~56% of the ~400-slot estimate -- RE-VERIFY, see above

active_layer_capacity = 128        # Halved from the dual-GPU configs' 256 (~1.9 GB) to leave more room for the persistent pool on this tighter budget
use_active_layer_area = true
active_layer_promote_hit_threshold = 1
move_on_promotion = true

expert_fetch_threads = 8
omp_max_threads      = 8
ram_cache_layer_adaptive  = true
vram_evict_demote_to_ram  = true
pin_vram_lru_fraction = 0.1
pin_ram_fraction      = 0.5

# GPU 0: RTX 3090, all-in-one (dense + KV + active-layer + expert cache).
[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
kv_cache_gb  = 3.0
kv_bits      = 4
# Worst-case-safe: covers the full non-BF16 dense pool (~7.5 GB) PLUS every
# attn_output layer staying quantized if BF16 gets no room at all (~12.93 GB
# worst-case pool reservation, confirmed identical across every real run of
# this model so far) -- with margin. Actual usage will likely be less once
# BF16 converts whatever fits in what's left after moe_cache_gb/KV/
# active-layer above claim their share first.
dense_gb     = 13.0
# Allocated FIRST on this device now that it's a genuine vault_gpus member
# (role="dense+moe"), not starved by BF16 like the old dual-role-slice bug.
# ~6 GB / ~400 slots is the realistic ceiling once dense/KV/active-layer are
# subtracted from this card's ~25 GB real headroom -- see the file header
# for why this is structurally smaller than the dual-GPU split's ~1500+
# slots, not a misconfiguration.
moe_cache_gb = 6.0
