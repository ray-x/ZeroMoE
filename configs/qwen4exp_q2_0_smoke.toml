# Q2_0 smoke test -- Qwen3.8-Flash-Next "GSQ-RCO" Q2_0 checkpoint
# (blk.N.ffn_down_exps.weight is Q2_0 on every MoE layer, the routed-expert
# down projection -- previously entirely unsupported by this engine).
# Minimal config: correctness/coherence check, not a tuned throughput config.
model_path = "/data/sdb/models/qwen3.8-flash-next/Q2_0"

log_path  = "debug_qwen4exp_q2_0_smoke.log"
log_level = "INFO"

context_size   = 512
max_new_tokens = 200
temperature    = 0.0
top_p          = 0.95
enable_thinking = false

direct_io  = false
io_uring   = false
drop_pages = true

host_ram_gb              = 80
ram_preload_all_experts  = true
ram_pinned_budget_gb     = 40.0
pin_ram_fraction         = 1.0
expert_fetch_threads     = 10
omp_max_threads          = 12
prefetch_worker_threads  = 4

pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
pinned_vram_capacity = 2000
pin_vram_lru_fraction = 0.0
pin_threshold         = 6
promote_hit_threshold = 6
promote_h2d_threshold = 6

use_active_layer_area = true
active_layer_capacity = 128
active_layer_promote_hit_threshold = 1

attn_qabsorb_gpu = false
attn_score_gpu   = false

moe_prefill_stream = false
moe_ggml_mul_mat_id = true
qwen4exp_decode_ggml_moe = true
qwen4exp_decode_device_hc = true
qwen4exp_full_graph = true
qwen4exp_full_graph_decode = true
qwen4exp_cpu_ggml_moe = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
qwen4exp_attn_gpu = true
moe_gpu_accum = true
expert_gpu_activation = true
gdn_proj_ggml = true
gdn_full_ggml = true
hc_ggml = true
moe_ggml_gpu_router = true
moe_ggml_device = 0

# Q2_0 routed experts are CUDA-capable now. Keep this budget at zero until
# the explicit 22-layer VRAM preload split is enabled for this smoke run.
qwen4exp_graph_expert_vram_budget_gb = 0.0

dense_bf16_prefill_gemm = true
dense_bf16_kquant = true

mem_guard          = true
mem_guard_warn_mb  = 16384
mem_guard_stop_mb  = 10240
mem_guard_poll_ms  = 500

vram_min_free_mb = 256

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 4.5
kv_cache_gb  = 1.0
kv_bits      = 4
moe_cache_gb = 15
