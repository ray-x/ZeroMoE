# Qwen3.8-Flash-Next (GGUF arch "qwen4exp"), UD-IQ1_M -- SINGLE-GPU (RTX 3090
# only). Same tuning as the dual-GPU sibling (configs/qwen4exp_3090_5060.toml),
# collapsed to one [[gpus]] entry, specifically so this engine can be A/B'd
# against llama.cpp's own single-GPU llama-bench runs (`CUDA_VISIBLE_DEVICES=0`
# / `-dev CUDA0`) on equal hardware -- the dual-GPU config is not a fair
# comparison point for that, since llama.cpp's reference numbers never used the
# 5060 Ti at all.
#
# VRAM budget (24 GB, role="dense+moe", all on device 0). VERIFIED ON REAL
# HARDWARE not to OOM (0 "grow ... failed" lines, 2 real runs): a 2824-token
# synthetic prefill landed at 20.43-... s, 138.2 tok/s -- see this file's
# own settled numbers below once measured further.
#   dense_gb=4.1 (this model's real dense-tensor requirement, per the
#   startup [CONFIG] warning -- NOT the dual config's stale 6.3) +
#   kv_cache_gb=2.0 (moved here from the dual config's GPU 1) + ~4.5 GB
#   reserved for the ggml MUL_MAT_ID/HC graphs (moe_ggml_device=0 targets
#   THIS device, same as the dual config's GPU 0) + moe_cache_gb=11.5 (down
#   from the dual config's COMBINED 18.0+7.0=25.0 across two cards -- this
#   is the real cost of one GPU instead of two: expert cache coverage drops
#   accordingly, so DECODE throughput on this config will be materially
#   worse than the dual-GPU one. This config is for PREFILL comparison;
#   re-tune moe_cache_gb if decode is also measured here.
#
model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M"

log_path  = "debug_qwen4exp_3090only.log"
log_level = "INFO"

context_size   = 8192
max_new_tokens = 80
temperature    = 0.0
top_p          = 0.95
enable_thinking = false

# --- I/O ---------------------------------------------------------------
# /data/sda is ntfs3 and this checkpoint has NOT been through
# `gguf_tool pack` (no 4096-byte tensor alignment), so O_DIRECT/io_uring
# are off for bring-up: one variable at a time. Revisit after correctness.
direct_io  = false
io_uring   = false
# Expert slabs are copied into the explicit RAM tier during startup. Drop the
# buffered source pages afterwards so the 75 GiB model is not duplicated in
# the Linux page cache on top of those RAM slabs.
drop_pages = true

# --- Host RAM expert tier ---------------------------------------------
# 60 GB (not the 108 GB GLM uses) because the 28.8 GB PLE table is mmap'd
# with MADV_RANDOM on top of this -- its page cache competes for the same
# 125 GB. See CLAUDE.md's zram/swap warning: pressure here collapses, it
# does not degrade gracefully.
host_ram_gb          = 100  # 12.0: if mmamp enabled
ram_preload_all_experts = true
# Persistent pinning is reused by the prefill GGML path for direct H2D. The
# 45 GB cap is the measured safe aggregate cudaHostRegister size on this box.
ram_pinned_budget_gb = 45.0
expert_fetch_threads = 10
omp_max_threads      = 12
prefetch_worker_threads = 4

# Model-specific usage/pin files. MUST NOT be .moestream_usage -- that one
# is GLM-5.3's (75 layers vs this model's 48).
# 2026-09-11: freshly regenerated from four isolated Qwen prompts. Each run
# used --ngen 64 and produced 61, 61, 61, and 40 output tokens; the files
# therefore contain real prefill plus >=40-token decode traffic, rather than
# the stale accumulated *_480 history. The old *_480 files are retained for
# comparison, but are no longer used by this profile.
pin_file           = ".moestream_usage_qwen4exp_4prompts40"
prefill_pin_file   = ".moestream_usage_qwen4exp_prefill_4prompts40"
freeze_usage_stats = true
pin_topk_per_layer   = 1
# Keep the complete MoE expert set in DDR for the GGML prefill path. One
# pinned VRAM expert per layer leaves the rest of each 512-expert layer in the
# RAM tier; the graph still has a small cache object for its normal runtime
# bookkeeping, but prefill's source is system memory.
# 2026-09-10: raised 48 -> 7680 together with vram_preload_prefix_layers=15
# below (real budget for that many complete-layer pins) -- see that field's
# own comment for the measured win and the real bug fix that unlocked it.
# Keep enough VRAM headroom for the dense-attention/GDN workspaces. 11,000
# pinned experts combined with the 19-GB MoE cache caused allocator pressure
# and 304 dense-attention GPU calls to fall back to CPU in a controlled run.
# The measured safe decode arm is 9,977 pinned experts with a 17-GB cache.
pinned_vram_capacity = 9977
pin_threshold        = 6
promote_hit_threshold = 6
promote_h2d_threshold = 6

ram_cache_layer_adaptive = false
vram_evict_demote_to_ram = true
prefetch_pilot_depth = 1
prefetch_pilot_k     = 10  # MUST match expert_used_count (top-10). See header.
# Qwen-only router prediction. It snapshots the device-authoritative HC
# stream-0 state after layer l, predicts layer l+1, and records overall and
# per-layer overlap plus RAM/VRAM/load coverage. This is independent of the
# generic GLM/DeepSeek pilot. Accuracy remains top-10, while only the top-5
# predictions are actively prefetched into the next layer's temporary VRAM
# active-layer area. Layer numbers are model layer indices (the report uses
# the same indices); excluded layers still collect prediction accuracy.
qwen4exp_router_pilot = true
qwen4exp_router_pilot_k = 10
qwen4exp_router_pilot_prefetch = true
qwen4exp_router_pilot_prefetch_k = 5
# Disable estimation-based prefetch on the layers below the 30% membership-
# accuracy cutoff observed in the current Qwen probe, while retaining the
# previously excluded layer 22. Prediction/accuracy collection remains on.
qwen4exp_router_pilot_prefetch_exclude_layers = [20, 21, 22, 25, 26, 27, 28, 30, 31, 33, 34, 35, 36, 37, 38]
qwen4exp_router_pilot_skip_fully_cached = true
# In performance mode, do not pay for a predictor graph when its target layer
# is explicitly excluded from estimation-based prefetch. Set false when doing
# a prediction-accuracy collection run.
qwen4exp_router_pilot_skip_prefetch_excluded_layers = true
# Optional Qwen-only prediction allow-list. Empty/unset predicts every target
# layer not skipped by the policies above. This affects only the advisory
# prediction/prefetch pilot, not production routing or usage-file pinning.
# This is the current top-5 >=80% set from the 40-token probe. Remeasure with
# representative prompts before treating it as permanent; excluded layers
# remain excluded from estimation-based prefetch in performance mode.
qwen4exp_router_pilot_predict_layers = [2, 4, 5, 6, 7, 12, 13, 14, 40]
# If a Qwen expert is deliberately routed to the CPU, use ggml's optimized
# IQ1_M x Q8_K path (the same kernel family used by llama.cpp). This has no
# effect while all IQ1_M experts use the verified CUDA kernel.
cpu_dot_ggml_iq1m = true
prefill_warm_via_prefetcher = true

use_active_layer_area = true
active_layer_capacity = 128
active_layer_promote_hit_threshold = 1
speculative_active_layer_promote_on_confirm = false
active_layer_upload_worker_threads = 0
decode_async_prewarm = true
# Event-polled active-layer prewarm: do not block the decode thread on
# sync_active_layer_batch().  The active slot's completion event is polled by
# find_active_expert(), while the RAM source is protected by pending_copy_event.
# Keep active_layer_upload_worker_threads=0 here; this mode is the same-thread
# async issue path and avoids worker hand-off complexity while being validated.
decode_async_prewarm_nonblocking = true
speculative_promote_to_active_layer = false
# --- MLA-only GPU fast paths: qwen4exp is NOT an MLA family -----------
attn_qabsorb_gpu = false
attn_score_gpu   = false

# --- startup preload -------------------------------------------------
# Tier 1 = pin_topk_per_layer ranks      -> VRAM, pinned
# Tier 2 = pin_vram_lru_fraction * slots -> VRAM, reactive LRU
# Tier 3 = pin_ram_fraction * ram slots  -> host RAM preload
# At host_ram_gb=95 the RAM tier holds ~495 of this model's 512 experts per
# layer, so Tier 3 at 0.9 stages nearly the whole 77 GB expert set up front.
# Measured effect: cache 31% -> 100% hit, disk 1.07s -> 0.00s per request.
#
# These MUST stay ABOVE the first
# --- prefill expert source (2026-09-06) -----------------------------------
# MUST stay ABOVE the first [[gpus]] header: everything after a [[table]]
# header belongs to that table, and a root key placed below it is silently
# parsed as a GPU field (this project's own documented TOML trap).
#
# Keep the MoE source in the host RAM tier. The GGML CUDA path copies
# resident slabs into its pinned staging buffers and then queues batched H2D
# transfers; it does not need whole-shard mmap. Set true only for the legacy
# mmap streaming path.
moe_prefill_stream = false
# Experts staged per chunk. Swept on real hardware: 16 -> 11.51s,
# 24 -> 11.33s, 32 -> 11.29s, 64 -> 11.64s, 128 -> 12.19s. Smaller chunks
# pipeline more finely; below ~24 per-chunk overhead starts to win again.
moe_prefill_stream_chunk = 32
# Routed-expert GEMMs through dequant->BF16 + cuBLAS instead of the fused
# GEMV-shaped kernel (whose (O,S) grid re-reads the whole weight per token
# row). Per-expert GPU time 0.369 -> 0.133 ms. NOTE: this is a genuine
# precision change -- BF16's ~8 mantissa bits can flip a close greedy
# argmax, so generated text is coherent but not token-identical to the
# fused path. Turn off if you need bit-comparability.
moe_expert_bf16_gemm = true

# --- ggml MUL_MAT_ID routed-expert FFN (EXPERIMENTAL) -------------------
# Runs the whole routed-expert FFN for a prefill layer as ONE ggml graph of
# three GGML_OP_MUL_MAT_ID nodes instead of Phase 3b's per-expert-bucket
# loop, so the token-to-expert grouping happens on the GPU (ggml-cuda sorts
# rows and derives expert bounds itself) instead of once per expert on the
# host. Needs a build with -DMOESTREAM_USE_GGML_CUDA=ON.
#
# MEASURED 2026-09-05, qwen4exp UD-IQ1_M, 441-token prefill, same binary,
# only this flag varied:
#   off -> 24.02/24.09s (18.3 tok/s), expert=17.06s
#   on  -> 10.22/10.25s (43.1 tok/s), expert=3.62s   [auto-selected GPU 1]
#   on  ->  9.24/ 9.34s (47.5 tok/s), expert=2.67s   [moe_ggml_device=0]
# The saving is NOT the matmuls (GPU compute is ~1.0s either way): it is the
# ~15.6s of per-expert host orchestration that sat untimed inside
# phase3_loop. Note the ggml path ships MORE bytes (15.3 GB vs 8.0 GB -- it
# forgoes the 47.7% VRAM-resident reuse) and still wins by 2.6x.
#
# moe_ggml_device: -1 auto-picks the vault GPU with the most FREE VRAM,
# which on this box is the PCIe x8 5060 Ti (6.9 GB/s H2D) rather than the
# x16 3090 (12.3 GB/s). Pinned to 0 here, which REQUIRES GPU 0's own
# moe_cache_gb to be lowered (22.5 -> 20.5 below) so the graph has room for
# its ~500 MB of compacted expert weights plus its own compute buffer.
#
# THIS CONFIG IS NOW TUNED FOR PREFILL, and that is a deliberate trade, not
# a free win: the ggml path bypasses the VRAM expert cache entirely during
# prefill (it needs every routed expert in ONE contiguous 3-D tensor, so it
# cannot reuse scattered cache residents), which makes moe_cache_gb almost
# irrelevant to prefill -- but DECODE still resolves every token's experts
# through that same cache, and 2 GB less of it is 2 GB less decode hit rate.
# Decode has not been re-measured at 20.5. Restore moe_cache_gb = 22.5 and
# moe_ggml_mul_mat_id = false to get the previous decode-tuned behaviour.
moe_ggml_mul_mat_id = true
qwen4exp_decode_ggml_moe = true
# Keep the S=1 HC/MoE handoff device-resident. The direct MoE input path
# updates both the flat graph input and its persistent reshape view, so it no
# longer reads the stale allocator buffer. Keep production decode routing on
# the AVX-512 host router: the GPU router is still used for batched prefill,
# while the prediction pilot remains GPU-backed independently.
qwen4exp_decode_device_hc = true
qwen4exp_decode_batch_stage = true
qwen4exp_decode_custom_hc_q8 = false
qwen4exp_decode_gpu_router = false
# Qwen-only grouped CPU IQ1_M path. It is inert until a layer is listed in
# cpu_affinity_layers, and is never consulted by other model families.
qwen4exp_cpu_ggml_moe = true
# moe_ggml_shared_expert: FIXED 2026-09-10 and re-enabled below.
# Real root cause (found via a new isolated unit test, Test 35 in
# main_test.cpp, comparing GgmlQwenSharedRunner against a CPU oracle):
# GgmlQwenSharedRunner::run()'s `device_x` parameter is ALWAYS a
# `ggml_tensor *` in production (run_qwen4exp_shared_device() in
# execution_layer.cpp passes engine.qwen4exp_device_hc_ffn_input, which
# GgmlHcRunner::pre_mix() sets via `*device_output = t_mixed_` -- a tensor
# handle, exactly like routed_output). run() instead fed device_x straight
# into cudaMemcpy() as if it were already a raw CUDA device pointer.
# Copying from a host ggml_tensor struct's address via
# cudaMemcpyDeviceToDevice is undefined behavior; in practice it silently
# produced an all-zero/garbage x_ input, so silu(0)*0=0 down the whole
# gate/up/act/shared chain and `combined` collapsed to just `routed` --
# confirmed via a [GGML-SHARED-ALIAS]/[GGML-SHARED-DBG] value trace before
# being fixed and removed. This also explains the earlier "layer=46, NaN,
# every ID exactly 4 apart" symptom: corrupted/uninitialized shared-expert
# output feeding into HC post-combine eventually poisoned the router's own
# weights several layers later, not at the point of injection. Fixed by
# dereferencing device_x as a ggml_tensor* (matching routed_output) instead
# of memcpy'ing the wrong bytes. Test 35 passes deterministically (worst
# rel=3.7e-07) across 6+ repeated runs, isolated from the full model via
# `MOESTREAM_TEST_ONLY_35=1 ./build_ggmlcuda/moestream_tests`. The earlier
# ggml_backend_synchronize() addition to run() was independently correct
# hardening and stays regardless (unrelated race it guards against is real,
# just wasn't this bug).
# Live end-to-end confirmation attempted but NOT achieved: real prefill+
# decode runs with --trace-abort-on-nan never actually exercise this path,
# because run_qwen4exp_shared_device() is only reached when gpu_route_device
# is true, which itself requires the undocumented, off-by-default env var
# MOESTREAM_QWEN4EXP_DEVICE_ROUTE=1 PLUS every expert of that layer already
# VRAM-resident (all_experts_device_resident) PLUS S>1 -- a combination this
# config's real model/layer structure never naturally satisfies (traced with
# temporary gate-logging, since reverted). Even with the env var forced on,
# zero layers hit it in a 574-token prefill + 20-token decode run. This
# device-route fast path is effectively dormant under normal operation and
# its own activation gating is a separate, unexplored question -- not a gap
# in this fix. Confidence in the fix itself rests on Test 35 (exact
# production calling convention, deterministic, was failing with rel=0.73
# or worse before the fix and passes at rel=3.7e-07 after) plus the full
# engine test suite staying green, not on a live NaN-abort run.
moe_ggml_shared_expert = true
# 2026-09-12 controlled Qwen decode A/B on PCIe Gen3 x16: planar copies
# reached 20.00 tok/s (70-token decode) versus 17.77 tok/s for packed
# H2D+device-unpack. Keep this Qwen profile on planar copies; other model
# configs retain their own defaults.
moe_ggml_planar_copies = true
moe_ggml_device     = 0
# Keep HC's mixed activation on the shared GGML device backend while the
# routed expert graph is submitted. The router returns only the compact route
# table to the host; the [S,D] activation stays device-resident.
moe_ggml_gpu_router = true
# HC/MoE temporary workspaces are reused by the shared CUDA stream's ordering
# rather than a host event wait at every layer. This is the device-pipeline A/B
# switch; set false for the conservative baseline.
ggml_async_graph_reuse = true

# Qwen4Exp hyper-connections as ggml GPU graphs. MEASURED 2026-09-05: HC was
# 61% of prefill -- 3.29s of CPU compute PLUS ~2.3s of dense_gpu, because its
# three dense_proj calls pushed 18.1 MB xn/gate tensors over PCIe six times
# per layer (5.3 GB/prefill). With the intermediates kept in VRAM: HC 3.29s ->
# 0.42s and dense_gpu 2.67s -> 1.08s, prefill 9.18s -> 6.70s.
hc_ggml             = true

# GDN's four shared-input projections (attn_qkv/attn_gate/ssm_alpha/ssm_beta,
# all reading the SAME hidden_states) fused into one ggml graph, replacing
# four separate dense_proj calls + a CPU decay-log/sigmoid postprocess loop.
# MEASURED 2026-09-05, 504-token prefill, position-controlled A/B (3 pairs,
# identical warmup immediately before each measured run, 0 errors either
# arm): dense_gpu 0.91-0.93s (424 calls) -> 0.54s (280 calls) -- a real,
# reproducible removal of 144 dense_proj calls/prefill (36 layers x 4) --
# but the GDN bucket's OWN qkv+gate_proj+gates sub-timers stayed flat
# (0.43s -> 0.41s: the ggml graph's own upload+compute+download costs about
# the same as what dense_proj was already doing, just accounted
# differently), so total prefill tok/s was a WASH within this hardware's own
# noise band (mean 97.98 -> 99.01, ~1%, overlapping ranges across all 6
# runs). Kept ON per this project's "harmless, real call-count reduction,
# zero regression" convention (same as Pass B batching) -- not a throughput
# lever on its own, just fewer, cheaper CUDA API calls.
gdn_proj_ggml       = true

# gdn_full_ggml: fuses the ENTIRE GDN sub-block (projection+conv+delta_rule+
# l2norm+out_norm+ssm_out) into one continuous device-resident ggml graph,
# instead of the split path above which still does l2norm/out_norm on CPU
# (plain OMP-parallel scalar loops, no GPU kernel exists for them at all)
# and out_proj through a per-layer dense_proj round trip. Was OFF, untested
# (no unit test, no CLAUDE.md history) until 2026-09-10's real-vs-llama.cpp
# stage-by-stage comparison found attn=1.9s vs llama.cpp's 70ms GPU kernel
# time for the equivalent work -- a 27x gap, larger than the expert-dispatch
# gap this session had been chasing.
# MEASURED, 488-token real-text prefill, same prompt/config otherwise:
#   off -> 62.72 tok/s, attn=1.90s
#   on  -> 74.56 tok/s, attn=0.58s (+18.9% prefill, attn bucket -69.5%)
# VERIFIED correct, not just fast: MOESTREAM_GGML_FORCE_GDN_FULL_HOST=1 +
# MOESTREAM_GGML_GDN_FULL_STATS=1 + trace_abort_on_nan=true forces the
# host-readback path (the device-tensor fast path above skips all host-side
# checks) -- 72/72 GDN-FULL-STATS lines (36 layers x input+output, all 36
# GDN layers) read bad=0, max_abs across every layer bounded at 37.59, no
# aborts. Forced-host run itself measured 69.33 tok/s (still a real win
# over baseline, the device-tensor path is faster still since it skips the
# verification-only readback).
gdn_full_ggml = true

# MUST stay ABOVE the first [[gpus]] header. In TOML everything after
# a [[table]] header belongs to that table, so a root key appended at the
# END of this file is silently swallowed by gpus[1] and never read --
# CLAUDE.md documents that exact trap costing real wasted A/B runs.
pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
# vram_preload_prefix_layers: "Experimental llama.cpp-style placement: fill
# the VRAM expert cache in ascending layer order, starting at layer 0, until
# the cache is full" -- an existing, never-enabled-before mechanism, same
# discovery pattern as gdn_full_ggml above. Real, DEPENDENT chain of two
# findings, 2026-09-10:
#   1. First attempt (this + pinned_vram_capacity=7680 alone) was a 3.3x
#      REGRESSION (74.18 -> 22.53 tok/s): it starved the RAM tier's own
#      preload for the SAME layers (RAM 24576->16896, cache 100%->74%, 3.12
#      GB of real NVMe reads reappeared) -- see execution_layer.cpp's
#      `ram_start_i` fix (src/main.cpp, same date) for the real root cause:
#      RAM and VRAM tier preload used to share ONE sequential candidate
#      list per layer (VRAM consumes first, RAM gets only the remainder),
#      even though RAM (100 GB here) and VRAM (this pool) serve mostly
#      DIFFERENT consumers for this dispatch path and should never have
#      been forced disjoint.
#   2. After that fix (RAM tier always ranks independently, matching what
#      cpu_affinity_layers already did): RAM tier preload stayed intact
#      (24576, cache=100% hit) AND this setting gave a real, reproducible
#      win. 488-token real-text prefill, 3 repetitions: 78.93 / 76.65 /
#      76.82 tok/s (mean 77.47) vs the gdn_full_ggml-only baseline's 73.18 /
#      74.80 / 74.56 (mean 74.18) -- +4.4%. VRAM reuse (the "Prefill stream
#      VRAM reuse:" line) went 0.3% -> ~13.0%.
#   The compact pool physically provides 3120 slots across these first 15
#   layers. The preload planner now reads each layer's real compact region and
#   caps the request before reading/uploading, so the informational 7680
#   budget produces 3120 pins with zero avoidable "no-victim" errors. Tried
#   right-sizing to what empirically fits (6 layers / 3072) instead of
#   requesting 15/7680 -- that measured WORSE (74.17 tok/s, only 5.4% reuse):
#   fewer layers requested gives shallower real coverage. Keep the broader
#   prefix and let the planner stop at physical capacity.
vram_preload_prefix_layers = 0
vram_cache_full_layer_prefix = 0
# 2026-09-10: TRIED raising 0.0 -> 1.0 per direct user request ("we should
# not waste the vram"), REVERTED -- real, measured, severe regression, not
# a win. D2D reuse DID jump as hoped (0.3% -> 65.5%, confirmed via the
# "Prefill stream VRAM reuse:" line), but overall prefill went 62.61 -> 29.67
# tok/s (2x WORSE). Root cause, confirmed via the "[PIN] Preloaded" line:
# VRAM tier 2 (this fraction) and RAM tier 3 (pin_ram_fraction) preload from
# ONE SHARED, SEQUENTIALLY-CONSUMED ranked candidate list per layer, not
# independent budgets -- "next 208/layer VRAM-unpinned" consumed slots that
# used to go to RAM tier, dropping RAM preload 24528->14544 (a loss of 9984,
# matching the VRAM-unpinned count exactly). Since the prefill dispatch path
# (moe_ggml_mul_mat_id/GgmlMoeRunner) sources data from the RAM tier via
# ram_direct/ram_staged and only checks VRAM via a per-expert D2D lookup,
# losing RAM coverage hurt it far more than gaining VRAM coverage helped:
# cache hit 100%->78%, real disk I/O appeared (2.95 GB actually read from
# NVMe, 0 before), ram_direct collapsed in favor of the slower ram_staged
# path. A real fix needs VRAM tier 2 to NOT shrink RAM tier 3's own
# candidate pool (e.g. RAM tier should rank independently over the full
# usage file, not "whatever VRAM didn't already claim") -- not attempted
# yet, real engineering work, left at 0.0 until that's done.
pin_vram_lru_fraction = 0.0
pin_ram_fraction = 1.0

# --- Prefill fast paths (2026-09-04) --------------------------------------
# Engine defaults are FALSE; opted into HERE, per-model, deliberately.
#
# dense_bf16_prefill_gemm: REAL, cleanly-isolated win. 3189-token prefill,
#   4 runs ON vs 7 runs OFF: 285.77/291.08/299.84/311.31s (mean ~297s) vs
#   336.05/336.22/339.97/340.15/349.75/359.09/365.14s (mean ~347s), i.e.
#   ~14% faster prefill; dense_gpu 57.4-58.1s -> 12.35-12.67s. Also verified
#   COHERENT on GLM-5.3, where it genuinely engages (313 Q8_0 dense tensors).
#
# moe_prefill_batched: the LARGEST single prefill win here. Isolated A/B,
#   3511-token prefill, same prompt, bf16 ON both arms, 2026-09-04:
#     off -> 468.31s (7.50 tok/s), dense_gpu 67.67s / 691,392 calls
#     on  -> 272.61s (12.88 tok/s), dense_gpu 15.89s /  17,280 calls
#   i.e. +71.7% prefill. The mechanism is mostly NOT the MoE regrouping --
#   it collapses the dense/shared path from ~691k per-token GEMV calls into
#   ~17k batched GEMMs. Both arms 0 errors, output coherent.
#   (An earlier version of this comment credited it with a 336->286s gain --
#   wrong; that was dense_bf16's, and this flag had been ON in every run so
#   it never varied. Two real bugs were fixed 2026-09-04 to get here: wrong
#   slab_capacity byte count, and a missing ram_pin across the GPU upload
#   window. It produced GARBAGE OUTPUT on GLM-5.3 before those fixes.)
#   DO NOT copy this flag into a GLM or DeepSeek config without re-verifying
#   generated text on that model.
moe_prefill_batched = true
dense_bf16_prefill_gemm = true
dense_async_copies = true
# Extends the BF16 dense GEMM to Q5_K/Q6_K. qwen4exp-VERIFIED ONLY -- measured
# on UD-IQ1_M (212 Q5_K + 40 Q6_K dense tensors), 512-token prefill:
#   off -> 50.56s (10.13 tok/s), dense_gpu cmp 3.51s, GDN 14.71s
#   on  -> 44.44s (11.52 tok/s), dense_gpu cmp 0.40s, GDN  5.13s
# Deliberately NOT enabled for GLM: unverified there, and GLM's GPUs have no
# spare VRAM for the BF16 weight copies (136 refused allocations in one run).
dense_bf16_kquant = true

# qwen4exp_attn_gpu: dense full-attention (12 of 48 layers) on the GPU --
# two cuBLAS strided-batched GEMMs + one causal-softmax kernel replacing the
# per-(token,head) AVX-512 CPU loop. MEASURED 2026-09-04, 3511-token prefill,
# same prompt, only this flag toggled:
#   off -> dense full-attention 47.161s, prefill 303.86s (11.55 tok/s)
#   on  -> dense full-attention  5.162s, prefill 265.19s (13.24 tok/s)
# i.e. 9.1x on the attention itself, +14.6% whole prefill, 0 errors, and the
# generated text was BYTE-IDENTICAL between the two arms.
qwen4exp_attn_gpu = true

# qwen4exp_gdn_gpu: chunkwise-parallel gated delta rule for the 36 GDN
# (recurrent) layers on the GPU -- 2 batched cuBLAS GEMMs + a shared-memory
# forward substitution per 64-token chunk, batched across all 48 value heads.
# Verified bit-close to the CPU closed form (Test 25: out 2.7e-07, state
# 1.7e-07), 0 CPU fallbacks on real runs.
# HONEST SIZING: worth ~2s. The 82s "GDN (recurrent)" bucket it was built to
# attack turned out to be 79% causal conv1d (fixed separately, 61.97s->2.11s)
# and only ~2s actual recurrence. Kept because it is correct, free, and
# removes a sequential CPU dependency chain that would bite at longer prompts.
qwen4exp_gdn_gpu = true

# qwen4exp_gdn_conv_gpu: GDN's causal short conv + SiLU on the GPU.
# SUPERSEDED 2026-09-05 (same day): when gdn_proj_ggml is ALSO on (it is, by
# default), this now activates GgmlGdnProjRunner::run_with_conv, which
# chains the conv1d+SiLU DIRECTLY onto the qkv tensor that graph already
# produces on-device -- zero host round trip for qkv at all, not even the
# original standalone cuda/gdn_conv1d.cu kernel's own H2D+D2H pair. Real
# external evidence motivated this: a llama.cpp nsys profile (same model,
# same box) showed their own fused ssm_conv kernel costs 2.80ms for all 36
# layers at S=512, vs. our OWN standalone-kernel version's 180-190ms for the
# same 36 layers -- almost entirely the round trip this fusion removes.
#
# MEASURED, position-controlled A/B (3 pairs, 504-token prefill, 0 errors
# both arms), against the CPU-conv baseline (gdn_proj_ggml on, this flag
# off): conv 0.44-0.48s -> 0.00s (fully fused away), attn 2.40-2.55s ->
# 2.06-2.20s, prefill tok/s 98.04-99.95 (mean 98.81) -> 104.40-107.00 (mean
# 105.88, ~7.2%) -- roughly double the ~3.7% the standalone-kernel version
# got, confirming the round trip (not the conv compute itself, which is
# ~free either way) was the real cost.
#
# ggml-cuda's ssm_conv kernel hard-asserts channel count % 128 == 0 (a real,
# undocumented constraint found via Test 29, not a graceful failure) --
# qwen4exp's real conv_dim (10240) satisfies this; ensure_conv_weight()
# checks it and declines (falling back to the standalone kernel, then CPU)
# for any future checkpoint variant where it wouldn't, rather than crash.
# The standalone cuda/gdn_conv1d.cu kernel stays as that fallback's own
# fallback (used automatically whenever gdn_proj_ggml itself is off).
qwen4exp_gdn_conv_gpu = true

# moe_gpu_accum: accumulate routed-expert outputs on the DEVICE, one [S,D]
# download per layer, instead of downloading every expert's [n,D] output for a
# CPU weighted-add. This covers both grouped prefill and S==1 decode.
# MEASURED 2026-09-04, 3511-token prefill, only this toggled:
#   off -> 157.06s (22.35 tok/s), expert=20.44s
#   on  -> 140.07s (25.07 tok/s), expert=16.56s   (+12.2%)
# Kernel is bit-exact vs the CPU loop (Test 26, max_abs=0). Decode uses the
# same kernel with one token row and one final D2H per layer/GPU.
moe_gpu_accum = true

# expert_gpu_activation: routed-expert SwiGLU on the device. The old path sent
# gate AND up back to the host for a CPU silu/mul/clamp and uploaded the
# product again -- two extra PCIe crossings per expert. Measured dn=13.68s of a
# 48s 512-token prefill, against cmp=0.20s for the expert matmuls themselves;
# llama.cpp keeps the whole FFN in one GPU graph and never pays this.
# The unconditional NaN/Inf guard is preserved on-device (8-byte readback).
expert_gpu_activation = true


# --- Memory safety (added 2026-09-05) -------------------------------------
# Host-memory watchdog. Warns early, then BLOCKS further host allocation
# rather than letting the allocator thrash. Real motivation: at host_ram_gb=96
# with a full page cache this machine took 1893 ms for a single 11 MB
# posix_memalign, 53 times -- CPU pinned at 100%, GPUs idle, prefill never
# finished, and nothing in the log said "out of memory". Refusing an
# allocation is bounded (the RAM tier re-reads that expert); thrashing is not.
# Uses /proc/meminfo MemAvailable, NOT MemFree -- MemFree excludes reclaimable
# page cache and reads near-zero on a healthy machine.
mem_guard          = true
# 2026-09-09: raised from 4096/4096 after a real crash on the GLM5NEXT side
# of this same full-graph work (a 480-token prefill took the whole machine
# down hard enough to need a reboot). Explicit user instruction: leave
# 10 GB of real headroom, always -- applied here too since qwen4exp shares
# the identical full-graph compute-time admission check.
mem_guard_warn_mb  = 16384  # log a warning below this
mem_guard_stop_mb  = 10240  # refuse new host allocations below this low-water mark
mem_guard_poll_ms  = 500

# VRAM headroom for DYNAMIC (grow-at-runtime) buffers: keep at least this much
# free on each GPU. NOTE this is a free-memory FLOOR, not llama.cpp's
# fraction-of-total watermark -- that form was tried and is wrong here:
# MoEStream deliberately fills VRAM (expert cache ~23.7/24 GB by design), so a
# 90%-of-total test reads "already over budget" and refused 11,632 dynamic
# allocations, permanently disabling the BF16/attention/GDN fast paths and
# costing 2.6x throughput (14.97 -> 5.79 tok/s). llama.cpp applies 0.9 at model
# LOAD to size offload, which is a different decision.
vram_min_free_mb   = 256

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 4.1
kv_cache_gb  = 2.0
kv_bits      = 4
# 2026-09-09: raised 11.5 -> 17 per explicit user request, using real
# measured headroom: [VRAM] after dense tensor offload showed used=15.83GB/
# free=9.47GB (out of 25.30GB decimal total) with the OLD 11.5GB value --
# the ggml MUL_MAT_ID/HC graphs' actual footprint is only ~0.75GB (700MB
# weight buffer + 50MB packed transfer, from the real [GGML-MOE] log line),
# not the ~4.5GB this comment used to estimate. A direct A/B (11.5 vs 17.5,
# 480-token prefill) showed 17.5 makes NO throughput difference either way
# (62.61 vs 62.82 tok/s baseline, within noise) -- moe_ggml_mul_mat_id=true
# means PREFILL bypasses this cache entirely (expert_calls=0GPU/0CPU,
# 0.3% VRAM reuse; prefill streams straight from the RAM tier through the
# GGML-MOE runner's own small buffer, see ggml_moe_backend.hpp's NBUF
# comment for that mechanism's real bottleneck). This cache matters for
# DECODE, not prefill: a bigger VRAM-resident expert set here means fewer
# decode-time RAM-tier fetches, which is the user's own reasoning for this
# change (less host_ram_gb pressure, less repeat NVMe/RAM-tier traffic).
# 17 leaves ~2.5-3GB headroom for the ggml graph's own arena + dynamic
# scratch -- re-verify with a real run (watch for "grow ... failed" lines
# and the [VRAM] after-dense-offload figure) if you raise it further.
# 2026-09-10: RE-VERIFIED 19 is now a MUCH more decisive regression than
# before, because pinned_vram_capacity was since raised 48 -> 7680 for
# vram_preload_prefix_layers (see that field's own comment) and now
# competes for the same VRAM headroom this comment already flagged as
# thin. Real run, same 574-token prompt: moe_cache_gb=19 hit actual CUDA
# OOM -- "[ERROR] [GGML-MOE] weight buffer alloc failed (646.88 MB on GPU
# 0)" and "[ERROR] [CUDA] ensure_buffers: d_x grow to 23.51 MB failed: out
# of memory" -- forcing a full CPU fallback (expert_calls=0GPU/807CPU) and
# collapsing prefill to 33.24 tok/s vs the moe_cache_gb=17 baseline's
# 79.84/86.37/85.66 tok/s (mean 83.96). Do not raise this without also
# lowering pinned_vram_capacity or vram_preload_prefix_layers to compensate.
# 19 GB competes with the pinned hot set and the dense/GDN graph arenas on a
# 24-GB RTX 3090; the real run above showed CUDA allocation refusals and CPU
# dense-attention fallback. Keep the measured 17-GB decode budget.
moe_cache_gb = 17
