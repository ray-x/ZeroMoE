# Qwen3.8-Flash-Next MTP (speculative decoding) correctness test -- SINGLE
# GPU (RTX 3090 only), based on configs/qwen4exp_3090_only.toml's own tuned
# single-GPU baseline (do not edit that file for MTP work -- it's the
# peer session's own active prefill-throughput benchmarking surface; this
# is a separate copy specifically for MTP validation).
#
# TWO deliberate differences from qwen4exp_3090_only.toml:
#
# 1. model_path is the EXPLICIT FIRST SHARD FILE, not the model directory.
#    Real, CONFIRMED finding (2026-09-09, this session): the model
#    directory also contains the separate "shared" MTP checkpoint
#    (mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf), and GGUFFile::load_header
#    scans a DIRECTORY for every *.gguf file with no prefix filtering --
#    verified via a real tensor/KV dump that pointing model_path at the
#    directory pulls that file in as a bogus "4th shard" (1256 tensors
#    instead of 1224) and, since directory-scan order is alphabetical
#    ('m' > 'Q' in ASCII, so the mtp file loads LAST), its own
#    qwen4exp.block_count=49 / nextn_predict_layers=1 KV OVERWRITE the
#    real base model's block_count=48 / (absent) nextn_predict_layers.
#    (For ordinary non-MTP inference this happens to be harmless by
#    numerical coincidence -- c.n_layers = block_count - n_layer_nextn =
#    49-1 = 48 either way -- but this MTP code path explicitly special-
#    cases "the base file has NO nextn_predict_layers key" and would
#    compute the wrong c.n_layers if that assumption is silently violated
#    by directory-scan contamination.) Explicit file path form uses the
#    "-of-" prefix-matched sibling-discovery instead, which correctly
#    excludes the differently-named mtp file -- verified via the same
#    dump tool: 3 shards, 1224 tensors, block_count=48, no nextn key.
#
# 2. mtp_model_path / mtp_enabled / mtp_draft_tokens are added, and
#    max_new_tokens is raised enough to exercise a few real draft/verify
#    cycles (mtp_draft_tokens=3 needs remaining>1 per cycle -- see
#    Qwen4ExpMtpSpeculator::run()'s own remaining<=1 direct_tail fallback).
#
# Every other setting below is copied verbatim from qwen4exp_3090_only.toml
# as of 2026-09-09 -- if that file's own tuning changes, re-diff before
# trusting this file's throughput numbers, but the two differences above
# are what matter for a first correctness pass.

model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M/Qwen3.8-Flash-Next-UD-IQ1_M-00001-of-00003.gguf"
mtp_model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M/mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf"
mtp_enabled = true
mtp_draft_tokens = 3

log_path  = "debug_qwen4exp_3090_mtp_test.log"
log_level = "INFO"

context_size   = 2048
max_new_tokens = 64
temperature    = 0.7
top_p          = 0.95
enable_thinking = false

# --- I/O ---------------------------------------------------------------
direct_io  = false
io_uring   = false
drop_pages = true

# --- Host RAM expert tier ---------------------------------------------
host_ram_gb          = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
expert_fetch_threads = 10
omp_max_threads      = 12
prefetch_worker_threads = 4

pin_file           = ".zeromoe_usage_qwen4exp_480"
prefill_pin_file   = ".zeromoe_usage_qwen4exp_prefill_480"
freeze_usage_stats = true
pin_topk_per_layer   = 1
pinned_vram_capacity = 48
pin_threshold        = 6
promote_hit_threshold = 6
promote_h2d_threshold = 6

ram_cache_layer_adaptive = false
vram_evict_demote_to_ram = true
prefetch_pilot_depth = 1
prefetch_pilot_k     = 10
prefill_warm_via_prefetcher = true

use_active_layer_area = true
active_layer_capacity = 128
active_layer_promote_hit_threshold = 1
active_layer_upload_worker_threads = 0
decode_async_prewarm = true
speculative_promote_to_active_layer = false

attn_qabsorb_gpu = false
attn_score_gpu   = false

moe_prefill_stream = false
moe_prefill_stream_chunk = 32
moe_expert_bf16_gemm = true

moe_ggml_mul_mat_id = true
moe_ggml_device     = 0
moe_ggml_gpu_router = true
ggml_async_graph_reuse = true

hc_ggml             = true
gdn_proj_ggml       = true

pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
pin_vram_lru_fraction = 0.0
pin_ram_fraction = 1.0

moe_prefill_batched = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true

qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true

moe_gpu_accum = true
expert_gpu_activation = true

mem_guard          = true
mem_guard_warn_mb  = 16384
mem_guard_stop_mb  = 10240
mem_guard_poll_ms  = 500

vram_min_free_mb   = 256

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 4.1
kv_cache_gb  = 2.0
kv_bits      = 4
moe_cache_gb = 17
