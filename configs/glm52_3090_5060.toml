# ZeroMoE — GLM-5.2 dual-GPU config (RTX 5060 Ti core + RTX 3090 vault)
#
# NOTE: UD-IQ2_M is a COMPLETE GLM-5.2 model (dense at Q5_K/Q6_K/Q8_0, experts at
# Q2_K/Q3_K packed as *_exps). Run it alone — dense_model_path is commented
# because UD-IQ4_XS on disk is a different (~13-layer) model, not GLM-5.2, which
# caused "blk.13 missing". Re-enable dense_model_path only with a matching
# GLM-5.2 (79-layer) dense file.

# model_path = "/path/to/local-resource"
model_path = "/path/to/model-or-shard-directory"
# dense_model_path = "/path/to/local-resource"
log_path = "debug.log"   # empty (default) = stderr
log_level = "DEBUG"        # VERBOSE | DEBUG | INFO (default) | WARN | ERROR
prefill_pin_file = ".zeromoe_usage_prefill"
# Was DEBUG + verbose_moe_log=true for the pin_topk_per_layer A/B test below --
# both are high-volume (one line per routed expert per token) and cost real
# throughput; switched back to real-run defaults. Re-enable only when actively
# debugging cache behavior.

# Was 4096/16 for the quick pin_topk_per_layer A/B test referenced below.
# Restored to real generation lengths -- adjust to your actual workload.
# context_size   = 32768
context_size   = 4096
max_new_tokens = 40   # 2048
temperature    = 0.0
top_p          = 0.95
drop_pages     = false
direct_io      = true
io_uring       = true

disk_batch_padding = true
disk_batch_padding_target = 8
# Was 55.0 (86% of a 64GB machine) -- cut to 45.0 after a real run showed the
# workstation freezing on larger prompts (fine on a trivial "hi" prompt,
# frozen on a bigger one) while a smaller/simpler run stayed fine. Larger
# prompts drive far more prefetch hints (11671 vs 3779 seen in this file's
# own history), which grows prefetch_staging_slots' pinned host memory --
# memory NOT counted against this budget (see that field's comment) -- on
# top of an already-thin ~9GB of system slack. Restore real headroom first;
# raise back only after confirming with free -h / dmesg that swap/OOM
# wasn't the actual cause.
host_ram_gb          = 55.0
verbose_moe_log      = false
promote_hit_threshold = 2

prefetch_worker_threads = 0

# Pinned-host staging pool for the async prefetcher (engine_config.hpp /
# async_prefetcher.hpp). Was a hardcoded 64-slot compile-time array; a real
# run's perf report showed "Staged-unused evict: 3659 / 4583 misses" -- i.e.
# ~80% of misses were correctly predicted (Pilot recall 85.1%) and
# successfully staged, then round-robin-evicted before the matching cache
# miss ever consumed them, purely because the pool was too small relative to
# in-flight hints. Doubled to 128 -- but a longer real run (32k context, 50
# decode tokens) showed hint volume grows with workload size about as fast
# as the pool did (11671 hints processed vs 3779 before), so the
# staged-unused-evict RATIO barely moved (11387/11671 ~= 97.6% vs
# 3659/3779 ~= 96.8% before). Raised again to 256, then cut back to 128
# after a real workstation-freeze incident on a large prompt (see
# host_ram_gb's comment) -- this pool's memory isn't counted against
# host_ram_gb, and 256 slots at large-prompt hint volume was suspected to be
# the actual overflow. Each slot lazily grows to the largest expert slab it
# has held, so this still costs a few GB of additional pinned host RAM --
# watch total system memory if you raise this again.
prefetch_staging_slots = 128

# Against the CURRENT ~1322-slot pool (moe_cache_gb=19.5 on the 3090):
# avg_vram_slots_per_layer = 1322/75 ~= 17.6, so 0.1 -> ~2/layer (~150
# total) pre-warmed-but-unpinned, on top of Tier 1's 1050 pinned -- leaves
# genuine reactive headroom (~1322 - 1050 - 150 ~= 122 slots). Same
# caution as before applies: this fraction is of the WHOLE pool's average,
# not of whatever Tier 1 leaves behind -- re-check both together whenever
# pinned_vram_capacity or moe_cache_gb change.
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.5
ram_cache_layer_adaptive = true
vram_evict_demote_to_ram = true
# OMP threads for parallel disk reads of a layer's topk cache misses.
# Was the default (4)
# UNCAPPED omp parallel-for (bounded only by core count, 12 on this Xeon
# W-2235) and gets ~3.7x our measured disk throughput (1.77 GB/s vs our
# 0.48 GB/s) on the same NVMe -- suspiciously close to a 3-4x parallelism
# ratio. Raised to 8 (not the full 12 cores) per explicit request to leave
# headroom for other CPU work (OMP dequant/dot, prefetcher). See CLAUDE.md.
expert_fetch_threads = 8

# NEW: process-wide default OpenMP team size for every OTHER parallel
# region (attention/dense matmuls, the CPU expert-fallback dequant+dot
# path, reference dequant) -- these had NO cap at all until now (only
# expert_fetch_threads above, for its own one region, was ever capped),
# defaulting to every available core with nothing to stop several regions
# running concurrently. A real run made the OS itself become unresponsive
# to other commands from exactly this, once the CPU expert-fallback path's
# call volume grew large (a direct side effect of raising
# pinned_vram_capacity elsewhere in this file -- see CLAUDE.md). Set
# explicitly to 8 (matching expert_fetch_threads' own already-established
# reasoning for this 12-core machine) rather than leaving the 0/auto
# default (hardware_concurrency()-2 = 10 here), since the auto value is
# less conservative than what's already been validated as safe headroom
# on this exact hardware.
omp_max_threads = 8

# Re-enabled for testing (was pin_file="" / pin_threshold=0 -- see
# glm52_dual.toml's history for why it had been turned off, and re-verify
# hit rate before/after on this checkpoint given that prior result).
pin_file      = ".zeromoe_usage"
pin_threshold = 6
# Capped (was 0/auto-fill-available-capacity): a real run showed auto-fill
# pinning 1579/1642 VRAM slots (96%) at startup from a prior run's usage
# history, starving both the reactive cache and the decode-time GPU
# fallback of evictable room -- GPU dispatch collapsed from 94.7% to 48.8%
# and disk reads exploded to 133GB for 52 tokens. 8/layer caps the
# worst-case startup preload to ~608 slots (76 layers x 8) instead of
# nearly the whole cache. See CLAUDE.md.
#
# A/B test at 13 (975/1642 slots, ~59% of the VRAM cache) showed hit rate
# went slightly DOWN (52.3% vs. 53.4-53.9% at 8/layer), not up, while
# Pinned residents grew to ~60% of the whole cache -- no measured benefit
# from pinning more given how thin .zeromoe_usage's history still is
# (max count ~24-25). Reverted back to 8, with a note not to raise it again
# until the usage file has a much richer history.
#
# Re-testing now that it does: latest run shows 10050 known experts, max
# count 75 (3x richer than the last test). Raised back to 13/layer --
# closest approach to the pinned_vram_capacity=1024 target below given
# floor(1024/75)=13 and no per-layer remainder distribution exists (exact
# 1024 is unreachable with a uniform per-layer count; max achievable is
# 13*75=975). Confirmed working: 974 pinned in the real run that validated
# the eviction-race and moe_cache_gb fixes above.
#
# Raised to 16 (1200 total) when the main pool was 1464 slots -- but
# moe_cache_gb below has since dropped to 9.0, shrinking the pool to only
# ~616 slots. A real run showed this: pinned_vram_capacity=1200 against a
# 616-slot pool meant Tier 1's preload greedily pinned nearly the ENTIRE
# pool (unpinned_slots=1 left), leaving virtually no room for evict_lru to
# find a victim during actual generation -- a flood of "evict_lru found NO
# victim" errors throughout the run, not just at startup. Worse, since
# Tier 1 iterates layers in unordered_map order and stops once the pool
# physically runs out, whichever layers get processed LAST can end up with
# ZERO pinned experts while earlier ones get their full quota -- an
# uneven, iteration-order-dependent shortfall, not a fair one.
# Rebalanced against the CURRENT ~616-slot pool: 5/layer x 75 = 375 (~61%
# of the pool), leaving ~241 slots (~39%) genuinely reactive -- a similar
# ratio to the 974-pinned/1328-slot run that hit 42.3% hit rate before
# pinning was pushed further. ALWAYS re-check this against moe_cache_gb
# below whenever either value changes -- they must be sized together, not
# independently; pinned_vram_capacity should target roughly 50-60% of
# whatever cache_cap the log's "[GPU] Expert VRAM cache: N slots" line
# actually reports for the CURRENT moe_cache_gb, not a number left over
# from a previous experiment.
#
# CORRECTED: the [[gpus]] blocks below had drifted out of sync with this
# file's own title comment and the "swapped back" note further down --
# those describe 3090=vault/moe, 5060Ti=dense/CoreEngine (the validated
# layout that measured 0.21 tok/s), but the actual [[gpus]] role= fields
# were still set to the OPPOSITE (3090=dense, 5060Ti=moe) -- the slower
# layout, confirmed by a real run's "[GPU] Active layer area allocated ...
# on GPU 1" (GPU 1 = 5060 Ti = vault under that backwards config) and its
# throughput (0.19 tok/s, 34.2% hit) trailing the validated 0.21 tok/s/35%
# baseline. A config's comments describing an intended state is not proof
# the fields below actually hold that state -- always check the real
# [[gpus]] role= values, not just the surrounding prose. Fixed by putting
# the [[gpus]] blocks back to match: 3090->moe (vault), 5060Ti->dense
# (CoreEngine). Real pool size for moe_cache_gb=19.5 on the 3090: "[GPU]
# Expert VRAM cache: 1322 slots (19.5 GB total)".
#
# DISPROVEN BY A CLEAN A/B ON THIS EXACT POOL: raised to 14/1050 (79% of
# the 1322-slot pool) on the theory that ~80% pinned was historically
# best -- but that "82% was best" data point came from a DIFFERENT, larger
# 1464-slot pool with different usage history; it doesn't transfer here.
# A same-pool, same-role-layout, single-variable comparison (only this
# value changed) showed the OPPOSITE: 825/11 (62%) -> 0.21 tok/s/35% hit;
# 1050/14 (79%) -> 0.19 tok/s/38% hit -- hit rate genuinely improved but
# throughput got WORSE. Root cause, visible directly in the log: pinning
# 1050/1322 slots leaves only ~122 reactive slots (vs 347 at 825 pinned)
# for everything else, and that shrunk reactive pool has to
# promote-then-immediately-CPU-fallback far more often to keep up --
# "CPU fallback cause"/"Three-tier caching" showed promotions jumping
# 1485->2053 (all attributed to just_promoted), and the extra CPU
# dequant+dot cost (+15s/+5s) outweighed the hit-rate gain. Confirmed
# 825/11 (~0.20-0.21 tok/s across two separate real runs, within normal
# temp=0.7 sampling noise of each other) as the settled value on this
# pool. General lesson: a pinned-fraction "sweet spot" found on one pool
# size/usage-history combination does not transfer to a different pool
# size -- re-verify with a real same-pool A/B every time, don't
# extrapolate the ratio. See CLAUDE.md.
#
# CONFIRMED 12/900 (68%) via a real run -- matches or slightly beats the
# 825/11 baseline: 0.21 tok/s (tying the best 825 run), 34.9% hit rate
# (in the same band as 825's 33.6-35%), 1500 promotions (in the same
# healthy band as 825's 1485-1537, nowhere near 1050's 2053), and the
# FASTEST expert= time of every run tested so far (146.71s vs 825's
# 148.20-154.53s). Reactive pool at 900 pinned: 1322-900-150(tier2
# prewarm) = ~272 slots -- enough headroom to avoid 1050's promotion-churn
# problem (~122 reactive slots there). 900 is now the settled value,
# superseding 825 -- the margin over 825 is small enough that part of it
# is likely normal temp=0.7 run-to-run noise, but it is clearly NOT worse,
# and nowhere near the 1050 cliff. If tuning further, the next useful
# probe is somewhere in [900, 1050) to find where the falloff actually
# starts -- untested past this point.
#
# pin_topk_per_layer itself is now IGNORED -- pin_strategy below is set to
# global_topn, which replaces the uniform-per-layer distribution this
# value drove with a per-layer count derived from ranking every
# (layer,expert,count) triple across ALL layers together. Left here,
# unused, as the per_layer_topk fallback value in case pin_strategy is
# ever reverted -- see that field's own comment.
pin_topk_per_layer = 12

# pin_strategy: CONFIRMED via a real same-budget A/B against the 900/12
# per_layer_topk baseline (0.21 tok/s, 34.9% hit, 1500 promotions,
# expert=146.71s, 191.96s total) -- global_topn matched throughput
# (0.21 tok/s) while being faster on every other axis: 188.46s total (the
# fastest run this session), expert=143.23s, only 1431 promotions, same
# hit-rate band (34.6%). Margin is small enough that part of it is likely
# temp=0.7 noise, but it was never worse on any metric. Confirmed working
# as designed via [PIN-CONCENTRATION]: layer 4 (flattest layer) dropped to
# just 7.4% coverage (its floor-of-1 pin only), while layer 31 (most
# concentrated that run) got pinned up to 54.5% coverage -- real budget
# reallocation from flat to concentrated layers, not just noise in the
# aggregate numbers. Kept as the active strategy. If ever reverting to
# per_layer_topk, pin_topk_per_layer=12 above is the proven fallback. See
# CLAUDE.md's Pin Strategy entry.
pin_strategy = "global_topn"
# Every layer gets at least this many pinned slots (75 layers x 1 = 75,
# taken off the top of pinned_vram_capacity) before the remaining budget
# is spent on the global ranking -- confirmed this is enough to keep even
# the flattest layer (layer 4, dropped to 7.4% coverage under this floor)
# from losing protection entirely; a real run never showed it at 0 hits
# skyrocketing or otherwise misbehaving. No evidence yet that raising this
# would help -- untested past 1.
pin_global_floor_per_layer = 1

# Three-tier VRAM caching configuration
# Sized for the REAL ~1322-slot pool (moe_cache_gb=19.5 on the 3090
# below). 900 pinned (~68%) is the CONFIRMED settled TOTAL BUDGET via real
# same-pool A/B under per_layer_topk against both 825 (62%, matched/
# slightly beaten) and 1050 (79%, clearly worse -- promotion churn from a
# starved reactive pool) -- see pin_topk_per_layer's comment above for the
# full data. Kept unchanged while testing pin_strategy=global_topn above,
# so only the DISTRIBUTION of this same 900-slot budget changes, not its
# size.
pinned_vram_capacity = 1024       # total pin budget -- confirmed via real A/B under per_layer_topk, now being redistributed via global_topn
active_layer_capacity = 256        # Active layer workspace size for current-layer experts
use_active_layer_area = true       # Enable temporary layer area (prevents LRU eviction)
# Promote an active-layer expert into the real VRAM LRU cache (D2D copy)
# once it's re-accessed this many times while resident, instead of just
# being freed when its layer's window closes. This whole promotion path
# (and the hit-counting it depends on) didn't exist before -- the active
# layer area used to be a pure temporary hold-and-discard buffer, and
# n_active_layer_hits was never incremented anywhere, so 0 was expected
# regardless of how often it was actually being used.
active_layer_promote_hit_threshold = 1
move_on_promotion = true          # MOVE instead of COPY on RAM→VRAM promotion (eliminates tier overlap)
# Real run data showed expert= (MoE dispatch, the vault role's job) is
# ~92% of total wall time across every recent run, while attn=+dense_gpu=
# (the dense/CoreEngine role's job) together are only ~16% and partly
# overlap with expert via async dispatch anyway. Putting the faster 3090
# on the ~16%-of-time job (dense) while leaving the slower 5060 Ti on the
# ~92%-of-time job (moe/vault) made throughput WORSE despite the 3090
# being the faster card overall -- optimizing the small slice, not the
# dominant one. VALIDATED layout (0.21 tok/s real run): 3090 -> vault
# (moe), 5060 Ti -> CoreEngine (dense). See pin_topk_per_layer's comment
# above for the real 1322-slot pool size this moe_cache_gb=19.5 produces,
# and CLAUDE.md's "GPU Role Assignment Matters More For the MoE-Dominant
# GPU" entry for the full writeup.
#
# REQUESTED LAYOUT CHANGE, NOT YET VALIDATED: 3090 -> dense+moe (CoreEngine
# plus a supplementary expert-cache slice from its own leftover headroom),
# 5060 Ti -> moe only (sole primary vault). This puts the BULK of the
# expert cache on the smaller/slower 16GB 5060 Ti instead of the 24GB
# 3090 -- the opposite of the finding above, which favored putting the
# dominant ~92%-of-time role entirely on the faster card. Re-check
# pinned_vram_capacity/pin_topk_per_layer below against the real
# "[GPU] Expert VRAM cache: N slots" lines this produces (now split across
# two pools, not one) before trusting any of the sizing comments above.

# GPU 0 (nvidia-smi): RTX 3090 — CoreEngine (dense layers + KV cache +
# activations) PLUS a supplementary expert-cache slice on its own leftover
# VRAM (add_dual_role_expert_cache, sized from real free VRAM after
# dense/KV/BF16, not just this moe_cache_gb figure -- see main.cpp).
[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
kv_cache_gb  = 3.0
kv_bits      = 4
dense_gb     = 12.0
# Supplementary slice target only -- actual allocation is capped by
# whatever's really left after dense_gb/kv_cache_gb/BF16 fast-path claim
# their share of this card (available=23, dense=12, kv=3 -> ~8 GB
# headroom). Verify against the real "[GPU] Dual-role expert cache on ..."
# log line; if it allocates much less than 8.0, BF16 conversion likely ate
# the rest (see CLAUDE.md's "BF16 attn_output Fast-Path Starved a
# Same-Device Dual-Role..." entry).
moe_cache_gb = 9.0

# GPU 1 (nvidia-smi): RTX 5060 Ti — sole ExpertVault. Now carries the bulk
# of the expert cache despite being the smaller/slower card in this pair.
[[gpus]]
device_id    = 1
name         = "NVIDIA GeForce RTX 5060 Ti"
role         = "moe"
vram_gb      = 16.0
kv_cache_gb  = 0.0
kv_bits      = 4
dense_gb     = 0.0
# 12.0 leaves ~3GB of headroom (16GB - 1GB driver reserve - 12GB pool) for
# active_layer_area's ~3.77GB request (active_layer_capacity=256 below) --
# same margin style as the 3090's original 19.5/24GB sizing. Watch for
# "[GPU] Active layer area allocation failed" and lower this if it fires.
moe_cache_gb = 12.5
