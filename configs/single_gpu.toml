# ZeroMoE — Single GPU Configuration (Profile A)
# Everything on one RTX 3090: dense + KV + expert cache
# Context reduced to 64k to fit in 24 GB

model_path = "/models/GLM-5.2-UD-IQ2_M/"

context_size   = 65536
max_new_tokens = 2048
temperature    = 0.7
top_p          = 0.95
drop_pages     = false

promote_hit_threshold = 2
pin_file      = ".zeromoe_usage"
pin_threshold = 6
# Capped (was 0/auto-fill-available-capacity) -- see glm52_3090_5060.toml's
# comment / CLAUDE.md for the real-run regression this fixes.
pin_topk_per_layer = 8

# Three-tier VRAM caching configuration
# Eliminates 7.7GB tier overlap waste and increases pinned capacity to 1024
pinned_vram_capacity = 1024      # Maximum pinned experts (was ~600)
active_layer_capacity = 256        # Active layer workspace size for current-layer experts
use_active_layer_area = true       # Enable temporary layer area (prevents LRU eviction)
move_on_promotion = true          # MOVE instead of COPY on RAM→VRAM promotion (eliminates tier overlap)

# GPU 0: All-in-one
[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 7.5
kv_cache_gb  = 2.5
kv_bits      = 4
moe_cache_gb = 12.0
