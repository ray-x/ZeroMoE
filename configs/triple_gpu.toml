# ZeroMoE — Triple GPU Configuration (Profile C)
# RTX 5060 Ti (dense) + 2x RTX 3090 (expert vault)
# Full 128k context with Q4 KV cache

model_path = "/path/to/model-or-shard-directory"
# dense_model_path = "/models/GLM-5.2-Q4_K/"

context_size   = 131072
max_new_tokens = 4096
temperature    = 0.7
top_p          = 0.95
drop_pages     = false

promote_hit_threshold = 2
pin_file      = ".zeromoe_usage"
pin_threshold = 6
# Capped (was 0/auto-fill-available-capacity) -- see glm52_3090_5060.toml's
# comment / CLAUDE.md for the real-run regression this fixes.
pin_topk_per_layer = 8

# Three-tier VRAM caching configuration
# Eliminates 7.7GB tier overlap waste and increases pinned capacity to 1024
pinned_vram_capacity = 1024      # Maximum pinned experts (was ~600, targets colibri's 1024)
active_layer_capacity = 256        # Active layer workspace size for current-layer experts
use_active_layer_area = true       # Enable temporary layer area (prevents LRU eviction)
move_on_promotion = true          # MOVE instead of COPY on RAM→VRAM promotion (eliminates tier overlap)

# GPU 0: Core Engine — Dense layers + KV cache
[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 5060 Ti"
role         = "dense"
vram_gb      = 16.0
dense_gb     = 7.5
kv_cache_gb  = 4.5
kv_bits      = 4

# GPU 1: Expert Vault A
[[gpus]]
device_id    = 1
name         = "NVIDIA GeForce RTX 3090"
role         = "moe"
vram_gb      = 24.0
moe_cache_gb = 23.0

# GPU 2: Expert Vault B (optional — skipped if not present)
[[gpus]]
device_id    = 2
name         = "NVIDIA GeForce RTX 3090"
role         = "moe"
vram_gb      = 24.0
moe_cache_gb = 23.0
