# Qwen3.8-Flash-Next (GGUF arch "qwen4exp"), UD-IQ1_M -- SINGLE-GPU (RTX 3090
# only). DO NOT USE FOR REAL WORK -- kept as a reference/repro artifact only.
#
# A/B VARIANT of configs/qwen4exp_3090_only_decode.toml: identical in every
# respect except moe_decode_batched=true (default off everywhere else), to
# isolate that one flag's real effect.
#
# RESULT, VERIFIED ON REAL HARDWARE 2026-09-10 (same build, same 1-token
# prompt, position-controlled baseline/batched/baseline): this flag is a
# real, reproducible ~41% DECODE REGRESSION for this model, not a win --
# 5.03/4.97 tok/s baseline vs 2.93 tok/s with it on. qwen4exp's routed
# experts (UD-IQ1_M) already have a fast, working GPU kernel
# (480GPU/0CPU at baseline); forcing CPU dequant instead is strictly
# worse. moe_decode_batched MUST STAY FALSE for this model -- see
# dense_dispatch.hpp's own moe_decode_batched() accessor comment and
# memory: moe-decode-batched-regression.md for the full writeup. This
# file exists only so the regression is re-runnable/re-verifiable, not as
# a config anyone should actually launch for decode throughput.
model_path = "/data/sdb/models/qwen3.8-flash-next/UD-IQ1_M"

log_path  = "debug_qwen4exp_3090only_decode_batched.log"
log_level = "INFO"

context_size   = 2048
max_new_tokens = 32
temperature    = 0.0
top_p          = 0.95
enable_thinking = false

direct_io  = false
io_uring   = false
drop_pages = true

host_ram_gb          = 100  # 12.0: if mmamp enabled
ram_preload_all_experts = true
ram_pinned_budget_gb = 45.0
expert_fetch_threads = 10
omp_max_threads      = 12
prefetch_worker_threads = 4

pin_file           = ".zeromoe_usage_qwen4exp_480"
prefill_pin_file   = ".zeromoe_usage_qwen4exp_prefill_480"
freeze_usage_stats = true
pin_topk_per_layer   = 1
pinned_vram_capacity = 7680
pin_threshold        = 6
promote_hit_threshold = 6
promote_h2d_threshold = 6

ram_cache_layer_adaptive = false
vram_evict_demote_to_ram = true
prefetch_pilot_depth = 1
prefetch_pilot_k     = 10
prefill_warm_via_prefetcher = true

use_active_layer_area = true
active_layer_capacity = 128
active_layer_promote_hit_threshold = 1
active_layer_upload_worker_threads = 2
decode_async_prewarm = true
speculative_promote_to_active_layer = true

# The ONE flag this file varies vs. the decode-tuned sibling -- see
# dense_dispatch.hpp's moe_decode_batched() for the full writeup.
moe_decode_batched = true

attn_qabsorb_gpu = false
attn_score_gpu   = false

moe_prefill_stream = false
moe_prefill_stream_chunk = 32
moe_expert_bf16_gemm = true

moe_ggml_mul_mat_id = true
moe_ggml_shared_expert = true
moe_ggml_device     = 0
moe_ggml_gpu_router = true
ggml_async_graph_reuse = true

hc_ggml             = true
gdn_proj_ggml       = true
gdn_full_ggml = true

pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
vram_preload_prefix_layers = 15
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.9

moe_prefill_batched = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true
qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
moe_gpu_accum = true
expert_gpu_activation = true

mem_guard          = true
mem_guard_warn_mb  = 16384
mem_guard_stop_mb  = 10240
mem_guard_poll_ms  = 500

vram_min_free_mb   = 256

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 4.1
kv_cache_gb  = 2.0
kv_bits      = 4
moe_cache_gb = 17
