# ZeroMoE — GLM-5.2 CPU-ONLY config (all compute on CPU, no GPU dispatch)
#
# This is the "Run B" isolation config for the random-text investigation: it is
# glm52_dual.toml with `cpu_only = true` added. With that flag set, dense_proj /
# rmsnorm_proj / expert_ffn all skip GPU and run the CPU reference path (libggml
# dequant + f32 matmul). GPUs still initialize and dense weights still get
# mirrored to VRAM, but that VRAM is never read for compute -- so this isolates
# whether the garbage output comes from a GPU-side bug (async-upload race,
# device/stream, a fused kernel) vs a CPU math bug.
#
#   Compare against:  ./build/zeromoe --config configs/glm52_dual.toml        (GPU on)
#   This run:         ./build/zeromoe --config configs/glm52_cpuonly.toml     (GPU off)
#
# Equivalent one-liner without a new config (env var, same effect):
#   ZEROMOE_CPU_ONLY=1 ./build/zeromoe --config configs/glm52_dual.toml
#
# NOTE: much slower than GPU (experts dequant+matmul on CPU every token). That's
# expected -- correctness isolation, not throughput.

model_path = "/path/to/model-or-shard-directory"

context_size   = 32768
max_new_tokens = 2048
temperature    = 0.7
top_p          = 0.95
drop_pages     = false

# <<< THE SWITCH >>> forces ALL matmuls/norms/expert-FFNs onto the CPU path.
cpu_only = true

# 60 GB of your 64 GB for the MoE expert host LRU cache (CPU path reads experts
# from here; the VRAM expert cache below is allocated but unused under cpu_only).
host_ram_gb          = 60.0
verbose_moe_log      = false
promote_hit_threshold = 2
pin_file      = ".zeromoe_usage"
pin_threshold = 6
# Capped (was 0/auto-fill-available-capacity) -- see glm52_3090_5060.toml's
# comment / CLAUDE.md for the real-run regression this fixes.
pin_topk_per_layer = 8

# GPU entries are kept identical to glm52_dual.toml so the ONLY difference between
# the two runs is cpu_only. (Under cpu_only the VRAM expert cache and dense
# offload are allocated but never used for compute; trimming them would only save
# VRAM/init time, not change correctness. Left as-is to keep the diff minimal.)

# GPU 1 (nvidia-smi): RTX 5060 Ti — CoreEngine (unused for compute under cpu_only).
[[gpus]]
device_id    = 1
name         = "NVIDIA GeForce RTX 5060 Ti"
role         = "dense"
vram_gb      = 16.0
dense_gb     = 8.0
kv_cache_gb  = 5.0
kv_bits      = 4
moe_cache_gb = 0

# GPU 0 (nvidia-smi): RTX 3090 — ExpertVault (unused for compute under cpu_only).
[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "moe"
vram_gb      = 24.0
moe_cache_gb = 23.0
