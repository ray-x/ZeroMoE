# Full-graph decode for Qwen3.8-Flash-Next UD-IQ4_XS, single RTX 3090.
#
# Based on configs/qwen4exp_option_b_layer13.toml's baseline full-graph
# topology (this branch's own reference), WITHOUT the Option-B per-expert
# layer-13 split (deferred -- that's the next phase after this one). Two
# real fixes applied relative to blindly copying that file:
#   1. gdn_proj_ggml=true added explicitly. The reference config sets
#      gdn_full_ggml=true but NEVER sets gdn_proj_ggml (defaults false in
#      engine_config.hpp) -- per this engine's own runtime guard
#      ("gdn_full_ggml=true requires gdn_proj_ggml=true"), gdn_full_ggml is
#      SILENTLY INACTIVE there, always falling back to the host path. Set
#      both explicitly here so full-graph GDN actually engages.
#   2. VRAM budget re-sized for IQ4_XS: this quant's routed-expert bytes are
#      ~2x IQ1_M's (3.48 MB/expert max slab vs 1.77 MB, confirmed via
#      gguf_tool plan), so far fewer layers can be fully GPU-resident under
#      ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_LAYERS. llama.cpp's own --fit-target
#      independently found ~10-11 layers fit in ~22GB total (dense+kv+
#      resident layers) on this exact card/quant -- start there.
#
# Launch with:
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_TRAILING=1 \
#   ZEROMOE_QWEN4EXP_GRAPH_PRELOAD_LAYERS=10 \
#   ./build/zeromoe --config configs/qwen4exp_3090_only_iq4xs_fullgraph.toml

model_path = "/path/to/model-or-shard-directory"

cpu_affinity_layers = []
log_path = "logs/qwen4exp_3090only_iq4xs_fullgraph.log"
log_level = "INFO"

context_size = 2048
max_new_tokens = 128
temperature = 0.0
top_p = 0.95
enable_thinking = false

direct_io = false
io_uring = false
drop_pages = true

host_ram_gb = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 85.0
pinned_vram_capacity = 128
expert_fetch_threads = 0
omp_max_threads = 12
prefetch_worker_threads = 0

pin_file           = ".zeromoe_usage_qwen4exp_4prompts40"
prefill_pin_file   = ".zeromoe_usage_qwen4exp_prefill_4prompts40"
freeze_usage_stats = true

# Enable the master full-graph decode path (no Option-B split -- deferred).
qwen4exp_full_graph = true
qwen4exp_full_graph_decode = true
qwen4exp_cpu_gpu_overlap = true
qwen4exp_cpu_gpu_overlap_max_layers = 0

qwen4exp_decode_device_hc = true
qwen4exp_decode_gpu_router = false
qwen4exp_decode_ggml_moe = true
qwen4exp_cpu_ggml_moe = true
qwen4exp_cpu_strided_grouped = true
qwen4exp_cpu_fused_grouped = true
moe_ggml_mul_mat_id = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_gpu_router = true
moe_ggml_device = 0
qwen4exp_cpu_shared_device = true
hc_ggml = true
gdn_proj_ggml = true
gdn_full_ggml = true
qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
dense_bf16_prefill_gemm = true
dense_bf16_kquant = true
moe_gpu_accum = true
expert_gpu_activation = true

use_active_layer_area = true
active_layer_capacity = 10
decode_async_prewarm = false
prefetch_pilot_depth = 1
prefetch_pilot_k = 10
pin_vram_lru_fraction = 0.1
pin_ram_fraction = 0.9

mem_guard          = true
mem_guard_warn_mb  = 16384
mem_guard_stop_mb  = 10240
mem_guard_poll_ms  = 500
vram_min_free_mb   = 256

[[gpus]]
device_id = 0
name = "RTX 3090"
role = "dense+moe"
vram_gb = 24.0
dense_gb = 5.56
kv_cache_gb = 2.0
moe_cache_gb = 14.0
kv_bits = 4
