# Qwen3.8-Flash-Next (GGUF arch "qwen4exp"), UD-IQ4_XS -- SINGLE-GPU (RTX 3090
# only), for direct A/B against llama.cpp's own single-GPU llama-bench run on
# this SAME quant (`-dev CUDA0 -fitt 1024`, measured 2026-09-27):
#   pp512 = 259.07 tok/s, tg128 = 16.14 tok/s
#   llama.cpp's real chosen split (from load_tensors buffer sizes, not the
#   n_cpu_moe field which --fit-target does not populate): CUDA0 model
#   buffer = 22474.63 MiB, CPU_Mapped (mmap'd, host RAM/page cache) =
#   28110.09 + 41360.56 = 69470.65 MiB. i.e. ~21.95 GB resident on the 3090,
#   ~67.85 GB served from host RAM/disk via mmap. llama.cpp does this as a
#   static, whole-tensor CPU/GPU split (roughly the first ~10-11 of 48 MoE
#   layers fully GPU-resident, the rest fully CPU); ZeroMoE instead spreads
#   partial per-expert residency across ALL 48 layers via its VRAM LRU/pin
#   cache, so this is not a literal layer-for-layer copy of llama.cpp's split
#   -- it is a matching TOTAL VRAM budget for the MoE tier, produced the
#   ZeroMoE way.
#
# Real per-tensor census for THIS checkpoint (gguf_tool plan, 2026-09-27):
#   48 layers, 512 experts/layer, expert slab (gate+up+down) 3.48 MB max
#   (vs UD-IQ1_M's 1.77 MB -- almost exactly 2x, matching the quant's bpw
#   ratio) dense (persistent, always-VRAM) total 5.312 GB native, ~5.5 GB if
#   attn_output BF16-converts -> dense_gb sized to 6.0 here (up from
#   IQ1_M's 4.1) to leave headroom for that conversion.
#
# VRAM budget (24 GB, role="dense+moe", all on device 0):
#   dense_gb=6.0 + kv_cache_gb=2.0 + moe_cache_gb=15.0 = 23.0, leaving ~1.0 GB
#   headroom for ggml MUL_MAT_ID/HC/GDN graph arenas -- same ~0.9-1.0 GB
#   headroom shape as the IQ1_M sibling config's 4.1+2.0+17=23.1/24.
#   pinned_vram_capacity scaled by the 2x slab-size ratio: IQ1_M's 9977 -> 5000.
#
# Everything else (all runtime flags below) is copied UNCHANGED from
# configs/qwen4exp_3090_only.toml -- those flags are quant-and-shape
# independent engine behavior, not sized to a specific checkpoint's bytes.
# Re-verify each MEASURED comment in that file against this quant before
# trusting a specific number; only the VRAM-budget math above has been
# redone for IQ4_XS.
#
# Usage/pin files are REUSED from the IQ1_M profile (same base model, same
# architecture and routing weights, only quantization differs) as a starting
# point. Rebuild if routing coverage looks off for this quant.

model_path = "/data/models/qwen3.8-flash-next/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf"

log_path  = "logs/qwen4exp_3090only_iq4xs.log"
log_level = "INFO"

context_size   = 2048
max_new_tokens = 128
temperature    = 0.0
top_p          = 0.95
enable_thinking = false

# --- I/O ---------------------------------------------------------------
direct_io  = false
io_uring   = false
drop_pages = true

# --- Host RAM expert tier ---------------------------------------------
host_ram_gb          = 100
ram_preload_all_experts = true
ram_pinned_budget_gb = 85.0
expert_fetch_threads = 10
omp_max_threads      = 12
prefetch_worker_threads = 4

pin_file           = ".zeromoe_usage_qwen4exp_4prompts40"
prefill_pin_file   = ".zeromoe_usage_qwen4exp_prefill_4prompts40"
freeze_usage_stats = true
pin_topk_per_layer   = 1
pinned_vram_capacity = 3880
pin_threshold        = 6
promote_hit_threshold = 6
promote_h2d_threshold = 6

ram_cache_layer_adaptive = false
vram_evict_demote_to_ram = true
prefetch_pilot_depth = 1
prefetch_pilot_k     = 10

qwen4exp_router_pilot = true
qwen4exp_router_pilot_k = 10
qwen4exp_router_pilot_prefetch = true
qwen4exp_router_pilot_prefetch_k = 5
qwen4exp_router_pilot_prefetch_exclude_layers = [20, 21, 22, 25, 26, 27, 28, 30, 31, 33, 34, 35, 36, 37, 38]
qwen4exp_router_pilot_skip_fully_cached = true
qwen4exp_router_pilot_skip_prefetch_excluded_layers = true
qwen4exp_router_pilot_predict_layers = [2, 4, 5, 6, 7, 12, 13, 14, 40]
cpu_dot_ggml_iq1m = true
prefill_warm_via_prefetcher = true

use_active_layer_area = true
active_layer_capacity = 128
active_layer_promote_hit_threshold = 1
speculative_active_layer_promote_on_confirm = false
active_layer_upload_worker_threads = 0
decode_async_prewarm = true
decode_async_prewarm_nonblocking = true
speculative_promote_to_active_layer = false
attn_qabsorb_gpu = false
attn_score_gpu   = false

moe_prefill_stream = false
moe_prefill_stream_chunk = 32
moe_expert_bf16_gemm = true

moe_ggml_mul_mat_id = true
qwen4exp_decode_ggml_moe = true
qwen4exp_decode_device_hc = true
qwen4exp_decode_batch_stage = true
qwen4exp_decode_custom_hc_q8 = false
qwen4exp_decode_gpu_router = false
qwen4exp_cpu_ggml_moe = true
moe_ggml_shared_expert = true
moe_ggml_planar_copies = true
moe_ggml_device     = 0
moe_ggml_gpu_router = true
ggml_async_graph_reuse = true

hc_ggml             = true
gdn_proj_ggml       = true
gdn_full_ggml = true

pin_strategy = "global_topn"
pin_global_floor_per_layer = 1
vram_preload_prefix_layers = 0
vram_cache_full_layer_prefix = 0
pin_vram_lru_fraction = 0.0
pin_ram_fraction = 1.0

moe_prefill_batched = true
dense_bf16_prefill_gemm = true
dense_async_copies = true
dense_bf16_kquant = true

qwen4exp_attn_gpu = true
qwen4exp_gdn_gpu = true
qwen4exp_gdn_conv_gpu = true
moe_gpu_accum = true
expert_gpu_activation = true

mem_guard          = true
mem_guard_warn_mb  = 16384
mem_guard_stop_mb  = 10240
mem_guard_poll_ms  = 500

vram_min_free_mb   = 256

[[gpus]]
device_id    = 0
name         = "NVIDIA GeForce RTX 3090"
role         = "dense+moe"
vram_gb      = 24.0
dense_gb     = 5.56
kv_cache_gb  = 2.0
kv_bits      = 4
moe_cache_gb = 13.5
