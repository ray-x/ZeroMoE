# DeepSeek-V4.1-Flash Q2_K -- dual-GPU config (RTX 3090 dense+moe vault +
# RTX 5060 Ti as a second, pure-MoE VRAM cache tier).
#
# Built from deepseek_v41_single_gpu.toml after that config's own decode-perf
# pass (2026-09-12): correctness fixed (stale binary + shard1 Engram metadata,
# see session notes), direct_io/io_uring both verified real wins once the
# model was properly 4096-aligned (disk 1.4->1.8-2.2 GB/s, decode 1.09->1.21
# tok/s). This config's own change: GPU1 was sitting completely idle in the
# single-GPU config -- adding it as a second VRAM expert-cache tier roughly
# doubles total cache capacity for a model that fits in neither VRAM nor
# host RAM, which should raise the cache-hit rate directly (this workload is
# disk-bound, not compute-bound -- see the [REQUEST] line's own expert=
# breakdown, where disk= dominates).
model_path = "/home/ray/vllm-workspace/DeepSeek-V41-Flash"
log_level = "INFO"
context_size = 1024
max_new_tokens = 40
temperature = 0.0
top_p = 1.0
drop_pages = false
direct_io = true
io_uring = true
host_ram_gb = 80.0
freeze_usage_stats = false
pin_file = "/home/ray/Projects/MoEStream/.moestream_deepseek-v41_usage"
prefill_pin_file = "/home/ray/Projects/MoEStream/.moestream_deepseek-v41_usage_prefill"
pin_topk_per_layer = 0
pin_vram_lru_fraction = 0.25
pin_ram_fraction = 0.50
pinned_vram_capacity = 1024
prefetch_worker_threads = 4
expert_fetch_threads = 8
promote_hit_threshold = 2
# Restored to the documented default (was 0 = fully disabled in the
# single-GPU config) -- re-enables "stop evicting hot experts within a
# conversation" reactive pinning, no cross-prompt profile needed.
pin_threshold = 8
active_layer_capacity = 64
use_active_layer_area = true
move_on_promotion = true
# Real measured DEPTH-1 pilot accuracy on this model (k0=94.0%, k1=84.7%,
# fetch-worthy subset, n=500+ each -- see session notes) was previously
# gathered but never acted on (Pilot RAM->VRAM promotion: 0 attempted).
# Conservative static width matching where accuracy stays >=85%.
ram_vram_promote_top_k = 2

[[gpus]]
device_id = 0
name = "NVIDIA GeForce RTX 3090"
role = "dense+moe"
vram_gb = 24.0
# Corrected from the single-GPU config's stale 3.5 -- gguf_tool plan's real
# dense-tensor requirement is 2.686 GB; startup's own [CONFIG] warning flagged
# this. Not a hard cap either way (allocation is against real free VRAM), but
# keeps the by-hand headroom math accurate.
dense_gb = 3.2
kv_cache_gb = 2.0
kv_bits = 4
moe_cache_gb = 18.0

[[gpus]]
device_id = 1
name = "NVIDIA GeForce RTX 5060 Ti"
role = "moe"
vram_gb = 16.0
kv_cache_gb = 0.0
dense_gb = 0.0
# 16GB - ~1GB driver/CUDA-context reserve - ~2.5GB headroom for dynamic
# scratch/active-layer overflow, matching this project's own precedent for
# this exact card (glm52_3090_5060.toml uses 12.5 out of 16GB for the same
# GPU). UNVERIFIED for DeepSeek specifically -- watch for "[GPU] Active layer
# area allocation failed" or any VRAM OOM on this device and lower if so.
moe_cache_gb = 12.0
