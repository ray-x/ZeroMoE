attn_qabsorb_gpu_max_vram_gb = 2.0

# attn_score_gpu: 3-GEMM + softmax GPU path for MLA's score phase (decode
# only), replacing the CPU AVX-512 per-head loop -- real isolated bench
# (tests/bench_score_cpu_vs_gpu.cu) showed 5x-51x speedup, GROWING with
# context length (unlike qabsorb, this phase's CPU cost is unbounded with
# context for GLM-5.2), see CLAUDE.md for the full writeup. UNVERIFIED
# end-to-end on a real generation run as of this writing. Watch the startup
# "[MLA] score GPU fast-path: N/78 layer(s) KV mirror allocated" line (N
# should be close to 78) and the shutdown "MLA score GPU path" report line
# (real call count, near-zero CPU fallback).
# ROOT-SCOPE PLACEMENT REMINDER (learned the hard way with attn_qabsorb_gpu
# above): this MUST stay before the first [[gpus]] header below -- in TOML,
# everything after a [[table]] header belongs to that table until the next
# header, so a key placed after [[gpus]] silently becomes a field of that
# GPU entry instead of the root config, and doc.root.get_bool() never sees
# it. Confirmed by two real wasted test runs on attn_qabsorb_gpu before
# this was understood -- see that flag's own comment above for the story.
attn_score_gpu = true
attn_score_gpu_max_vram_gb = 2.0
# attn_score_gpu_max_context: real production run showed this GPU
# (CoreEngine, RTX 5060 Ti) only had 1.82GB free at this point in startup --
# qabsorb_gpu (0.98GB) + the UNCAPPED mirror at context_size=4096 (0.74GB)
# left only 0.10GB for WUV's own 1.22GB need (78 layers), so only 6/78
# layers got WUV coverage (see CLAUDE.md for the full writeup). Capping the
# mirror to 512 tokens instead of the full 4096 frees most of that VRAM for
# WUV WITHOUT reducing the model's real context_size -- the score GPU path
# just falls back to CPU (correctness-safe, already-tested) for any decode
# position beyond 512. Real ceiling on WUV coverage while qabsorb_gpu stays
# enabled is ~50/78 layers (64%) even at cap=0 -- WUV's own footprint alone
# already exceeds what's left after qabsorb. At cap=512: ~44/78 (57%),
# chosen to comfortably cover a short-to-medium conversation (this config's
# own test prompt only reaches ~50 tokens of context) while staying close
# to that ceiling. Watch the startup "[MLA] WUV BF16 GPU fast-path: N/78"
# line -- if real usage needs longer GPU-accelerated score coverage, raise
# this at the cost of fewer WUV-covered layers (see the tradeoff table in
# CLAUDE.md), or disable attn_qabsorb_gpu instead for full 78/78 coverage
# of both mirror and WUV with zero context cap needed at all.
attn_score_gpu_max_context = 512
# 2026-08-25 re-check: real A/B swept 512(baseline)/256/128 on real hardware,
# same prompt, looking for VRAM headroom to free for WUV/moe_cache_gb(GPU1).
