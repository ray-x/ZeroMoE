#
# 2026-08-16 REAL A/B, same frozen-usage-stats prompt, GPU util sampled
# via nvidia-smi through the whole session: raised 1.3 -> 2.5GB to see if
# a bigger local slice raises GPU1 utilization/hit-share. Conclusively
# NEGATIVE, not just a wash -- reverted to 1.3:
#   overall 0.68->0.56 tok/s (-18%), decode 0.85->0.74, prefill 1.08->0.77
#   GPU1 avg util actually DROPPED 11.9%->9.5% (not the intended direction)
#   593 real "out of memory" errors on device 1 this run (0 at 1.3GB) --
#   both GpuExpertScratch::ensure (the dual-role slice's OWN expert-FFN
#   scratch buffers) and dense ensure_buffers (qabsorb/score GPU paths)
#   started failing to grow, because the extra 1.2GB ate the ~1GB fixed
#   margin those buffers rely on. CPU expert fallback calls 118->432 as a
#   direct result. Root cause: this card's free margin is APPROXIMATE
#   headroom for dynamically-growing scratch buffers, not a static
#   allocation with slack to spare -- claiming more of it for a static
#   pool starves the dynamic consumers that share the same margin.
# Do not raise this again without first shrinking dense_gb/kv_cache_gb or
# otherwise freeing real (not apparent) margin on this card.
# 2026-08-16 follow-up REAL A/B: a smaller bump, 1.3 -> 1.8GB (matching
# the ~1.8GB the startup snapshot showed "free"). No OOM this time, but
# still net negative, same direction as the 2.5GB attempt just smaller:
#   overall 0.68->0.62 tok/s (-9%), decode 0.85->0.77, prefill ~flat
#   GPU1 avg util 11.9->11.5% (flat/slightly down, not the goal)
#   GPU1 peak real mem barely moved (15.51->15.50GB) -- the extra 0.5GB
#   static reservation just displaced dynamic scratch's own peak rather
#   than growing total usage, at some cost elsewhere (active-layer
#   prewarm sync ballooned 0.51s->3.45s that run, unconfirmed if noise).
# Two independent real runs (1.8GB and 2.5GB) both regressed, no run
# improved -- this card has no real headroom to give this pool at any
# tested increment. Single run each; if revisiting, confirm with a
# repeat run before trusting the exact magnitude, but don't expect the
# direction to flip.
# 2026-08-25: testing the OPPOSITE direction from every attempt above --
# SHRINKING this pool (not growing it) to free real static VRAM margin for
# qabsorb/score/WUV's own startup budget checks (attention_layer.cpp,
# warm_mla_absorb_cache), which all target THIS GPU (engine.gpu->device_id).
# Real measured shortfall: qabsorb(0.981GB)+mirror(0.092GB)+WUV(0.503GB) =
# 1.576GB already consumes nearly all of this card's ~1.8-1.9GB real
# post-static-pool margin, leaving WUV only 30/78 layers (38.5%) covered --
# 1920/3120 of its calls fall back to CPU at ~6x the GPU per-call cost,
