host_ram_gb          = 108.0
mirror_model_path = "/data/models/UD-IQ2_M_align"   # 2026-08-15: 2nd copy on the OTHER NVMe (KIOXIA). Stripes expert reads across both devices.
# 2026-08-16 RETEST under the corrected host_ram_gb=108 -- REGRESSED, worse
# than the original 40GB/host_ram_gb=120 test despite a much smaller 15GB
# budget: overall 0.62->0.57 tok/s, hit rate 71.9%->67.0% (-4.9pp, bigger
# drop than the original -3pp), major page faults 551682->1379430 (2.5x).
# BUT: baseline's OWN major-fault count (551682) was itself ~40x higher
# than a clean verification run a few turns earlier (13546, identical
# config) -- yet the system tested clean/idle immediately after (122GB
# available, 411MB swap). Likely confounded by many hours of repeated
# large alloc/free cycles (dozens of ~100GB-RSS process launches this
# session) causing some form of gradual memory-subsystem degradation not
# visible in a coarse `free -h` snapshot -- NOT a clean read on this
# feature specifically. That 15GB retest superseded, see below.
#
# 2026-08-17, at 10GB and moe_cache_gb(GPU1)=1.2: caught pinning to a REAL
# causal bug, not the memory-subsystem confound above. 6/6 back-to-back
# runs: pin=10 -> ensure_buffers' shared d_x/d_y dense scratch (cuda_
# manager.hpp, attn_output's dense_proj + rmsnorm_gpu_host) hit `d_x grow
# to 0.72 MB failed: out of memory` 78/78 times/run (every layer, all
# during prefill's larger S); pin=0 -> 0/78 every time. Root cause: pinning
# ~10GB of host memory (949 cudaHostRegister calls) contends with GPU1 for
# some driver-level resource cudaMemGetInfo's "free" number doesn't
# capture (likely BAR1/page-table aperture, not raw VRAM bytes) -- so it
# starves ensure_buffers even though qabsorb/score/WUV's own VRAM budget
# numbers look identical either way. Real cost: attn_output's outproj step
# forced onto CPU fallback for part of every prefill layer, 6.48s (pinned)
# vs 3.85s (unpinned) -- prefill 0.85 vs 1.09 tok/s. Decode was BETTER
# pinned (0.83 vs 0.76-0.81) as originally intended (upload_expert_active_
# async's DMA runs genuinely async off pinned host memory) -- the two
# effects roughly canceled in the overall number, which is why this looked
# like "no effect"/noise on the very first (single-run, moe_cache_gb=1.3,
# no reserve) attempt.
#
# FIXED via a small VRAM margin reserve for qabsorb/score's own budget
# checks (attention_layer.cpp, kDenseScratchReserveBytes=256MB, so their
# cudaMemGetInfo-based sizing never claims the WHOLE currently-free margin
# and leaves ensure_buffers' later prefill-time grow somewhere to go) --
# NOT fixed by lowering moe_cache_gb alone (tried first: those budget
# checks just claim more when more is free, reproducing the same near-zero
# remainder). VERIFIED ON REAL HARDWARE, 3/3 runs with pin=10 AND the
# reserve: d_x OOM 0/78 every run, outproj 3.88-3.90s (matches unpinned),
# decode=0.81, prefill=1.06-1.07, overall=0.67 tok/s -- the best, tightest
# result of every scenario tested (beats both the original broken-pinned
# 0.65 and the unpinned-only 0.64-0.67). Costs some WUV coverage (33/78
# layers vs 49/78 without the reserve, since WUV shares the same shrunken
# budget) -- net still ahead. Kept ON at this value; see [[ensure-buffers-
# dense-scratch-reserve-fix]] memory note for the full investigation.
# 2026-08-25: re-attempted raising this further, now that two things have
# changed since the 10GB value above was settled: (1) upload_expert_active_
# async's H2D runs on its OWN dedicated active_layer_stream (2026-08-19), no
# longer shared copy_stream -- removes the cross-stream-contention confound
# that made the earlier per-call cudaHostRegister attempts (see gpu_
# topology.cpp's own "Attempt 1/2" comment) hard to read cleanly; (2) host_
# ram_gb's own drift back to 115.0 was just corrected to the validated 108.0
# above, so this experiment started from a known-safe memory baseline. At
# 10.0, only 949/8468 (~11%) of RAM-tier slabs were actually pinned
# (shutdown report: "7519 slab(s) stayed pageable (budget exhausted)") --
# most of what upload_expert_active_async reads from was never pinned, so
# its DMA was mostly still paying the driver's internal synchronous bounce-
# buffer tax.
#
# Real 3-way A/B on hardware, same prompt, host_ram_gb=108 throughout
# (decode tok/s = 40/(request_wall - prefill_wall), from the [REQUEST]/
# [PREFILL] lines; active_layer_prewarm = issue+sync combined):
#   pin=10 (~11% pinned): decode 0.847, active_layer_prewarm 18.75s, MemAvail min 22.5GB, majflt delta 0
#   pin=30 (~35% pinned): decode 0.870 (x2 repeat, 0.870/0.870), active_layer_prewarm 17.60s/17.67s, MemAvail min 16.3-16.4GB, majflt delta 0
#   pin=60 (~70% pinned): decode 0.829, active_layer_prewarm 17.62s, MemAvail min 11.0GB, majflt delta +49 (first nonzero this session)
# No [ERROR] ensure_buffers: d_x grow ... out of memory at ANY budget tested
# (the GPU1 contention regression from the 10GB investigation, see [[ensure-
# buffers-dense-scratch-reserve-fix]]) -- the 256MB reserve fix holds up to
# 60GB pinned, not just the 10GB it was originally verified at.
#
# CONCLUSION: this reconfirms, rather than overturns, gpu_topology.cpp's own
# "Attempt 1/2" finding -- persistent pinning does NOT reduce active_layer_
# prewarm's total cost (bandwidth-bound: ~17.6-18.8s regardless of pin
# level), it only moves WHERE that cost is paid (issue, CPU-blocking, vs
# sync, the batch-wait) -- issue dropped 16.90s->14.00s->7.99s as more of
