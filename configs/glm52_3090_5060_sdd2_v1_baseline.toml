    # ram_vram_promote_dynamic_layer to off.

# 2026-08-26: per-layer accuracy veto, layered on top of whatever top_k is
# set above. Real [PILOT-BY-LAYER] data (CLAUDE.md) shows a genuine 33-44pp
# per-layer accuracy spread for all three pilots (early layers 3-20 much
# less predictable than mid/late layers 40-77) -- this vetoes a promotion
# the top_k cutoff above already allowed, per-layer, once that layer has
# min_samples of live data, if that layer's OWN measured accuracy is below
# threshold. Real A/B (see dense_dispatch.hpp's layer_promote_allowed and
# CLAUDE.md for the full writeup):
#   top_k=2 (this settled baseline) + gate on, threshold=0.65, min_samples=30,
#   3 runs: decode 0.87/0.84/0.86 (matches the top_k=2 baseline band exactly),
#   cache 68/66/68% (also matches) -- real, working (3/9/14 real vetoes, not
#   zero), but too light-touch to move anything: top_k=2 is already
#   conservative and min_samples=30 means most layers don't cross the floor
#   until late in a 40-token run.
#   top_k=3 (a value ALREADY KNOWN to regress under the flat cutoff, 62.4%
#   cache hit) + gate on, min_samples=15 (to engage earlier): cache STILL 63%
#   both runs (2x), decode 0.85/0.83 -- gate did NOT rescue the regression,
#   only 9/3178 vetoes both times. Root cause: rank-3's own weakness (the
#   thing driving that regression) is a PER-RANK effect (n_pilot_ram_only_
#   hits_by_rank), not a per-LAYER one -- most layers' own aggregate DEPTH-1
#   accuracy (hits/topk_sum, pooling all ranks) stays comfortably above 0.65
#   even where a SPECIFIC rank within that layer is weak, so this per-layer-
#   only gate can't see or veto that. A per-(layer,rank) gate would be needed
#   to actually address top_k=3's own regression -- not built; the 128x8
#   counter grid this would need doesn't exist yet. Left OFF (this settled
#   top_k=2 baseline is unaffected either way -- the light-touch test above
#   showed zero cost to leaving it on, but zero benefit either, so off by
