# gpu_topology.hpp for why a dedicated stream and larger decode_async_
# prewarm_max_batch were both tried and found not to help (genuinely
# bytes-bound, not contention- or call-count-bound).
prefetch_pilot_k = 8
prefetch_pilot_k_depth2 = 1
