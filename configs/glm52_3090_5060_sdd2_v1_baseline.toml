# request. Full WUV coverage needs ~1.31GB (78 layers), so total need with
# qabsorb+mirror is ~2.38GB against the current ~1.8-1.9GB margin -- a
# ~0.5-0.6GB shortfall. Unlike every GROWING attempt above (which claimed
# MORE of the same margin and starved the dynamic scratch buffers that
# share it), this frees a STATIC allocation before those dynamic checks
# ever run, so it should show up as real usable headroom rather than
# reproducing the same "no real slack" finding. Real A/B needed: does
# WUV coverage/decode throughput improve enough to outweigh this slice's
# own (small, ~50-100 slot) local cache-hit contribution.
moe_cache_gb = 1.2
# 2026-08-25 RESULT of the shrink experiment described in the comment block
# above: real 3-point A/B (1.2 baseline / 0.9 / 0.6), same prompt, decode
# tok/s = 40/(request_wall - prefill_wall):
#   1.2 (baseline): WUV 30/78 (38.5%), attn score=3.52s, decode 0.847-0.870 (established band)
#   0.9:            WUV 48/78 (61.5%), attn score=2.98-3.00s (x2 repeat), decode 0.870-0.871 (x2 repeat)
#   0.6:            WUV 66/78 (84.6%), attn score=2.37s,      decode 0.821 -- cache hit 65% (vs 67-69%), disk/phase_b/phase_c all up
# score= genuinely dropped as predicted at every point (the WUV GPU-path fix
# itself works exactly as designed) -- but the freed VRAM comes out of this
# card's own local expert-cache slice, and at 0.9 the resulting cache-hit
# cost (disk/ram_scan crept up ~0.5-0.7s) almost exactly CANCELS the score=
# saving (attn -0.5s, expert +0.6-0.7s, net wash, decode within noise of
# the 1.2 baseline) -- and at 0.6 the cost overtakes the saving for a clear
# net LOSS. Reverted to 1.2. This reconfirms, in the opposite direction,
# the SAME finding this pool's own growing-attempts already established:
# this card has no real spare margin to give ANY pool without taking it
