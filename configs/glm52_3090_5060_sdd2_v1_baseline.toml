# a small, consistent-direction signal (tighter band, never dipped as low
# as OFF's worst run), not yet fully decisive given this hardware's own
# documented run-to-run noise (non-bit-exact routing). Zero errors across
# all 6 runs, mechanism confirmed engaging correctly (2449/2449 fetch-
# worthy picks covered). Attempt 3 below (top-2 VRAM promote + this k=8
# push, DEPTH-1 held at its own top-2) was NOT a regression -- unlike
# attempts 1/2, a real improvement over the previous outright-regression
# results -- but across 3 runs (0.88/0.88/0.83 decode) landed within this
# hardware's own established baseline noise band, not clearly above it.
# Left OFF pending more runs, same status as the plain-hint-push-only test
# above. Attempt 4 (top_k=1, even more conservative) landed dead-center of
# the baseline band, not above it -- see attn_pilot_vram_promote_top_k's
# own comment for the full result. See CLAUDE.md for the full writeup.
prefetch_attn_pilot = false
prefetch_attn_pilot_k = 8
# attn_pilot_vram_promote_top_k: two real attempts, both regressed, both
# reverted -- see CLAUDE.md for the full writeup.
# Attempt 1 (top_k=4, stacked on DEPTH-1's unchanged top_k=2 + DEPTH-2
# k=4): decode 0.80 tok/s both runs (vs 0.84-0.87 baseline), cache hit
# 56.0%/56.3% (vs 64-69%). Root cause: "Pilot RAM->VRAM promotion: ~9900
# attempted" (vs ~2000 baseline) -- user correctly suspected duplicate
# loading. CONFIRMED real: DEPTH-1 and ATTN-PILOT both predict l+1 from two
# different inputs, top-K sets routinely overlap, and each independently
# called promote_ram_to_vram for the SAME (layer,expert) within the SAME
# transition before either's async copy was confirmed landed -- a genuine
# second wasted evict_lru+upload, not a harmless re-check. FIXED via a new
# per-transition cross-pilot dedup (execution_layer.cpp's vram_promoted_
# this_transition / n_pilot_promote_dedup_skipped) -- confirmed working on
# real hardware, ~30% (5316-5411/17491-17682) of raw attempts WERE genuine
# duplicates.
# Attempt 2 (this dedup fix + DEPTH-1 raised to top_k=8 "promote all" +
# this key still at 4 + DEPTH-2 k=4): removing the duplicate-attempt waste
# did NOT fix the deeper problem -- cache hit fell FURTHER, to 39-40% (two
# runs), decode 0.75-0.76 tok/s, RAM waste ~50%. The dedup fix answers "why
# was attempted-count so high" correctly; the over-promotion-VOLUME
# regression (too many low-confidence speculative promotions -> VRAM/RAM
# churn) is a separate, deeper mechanism it doesn't touch -- see
# ram_vram_promote_top_k's own comment (reverted to 2 separately).
# REVERTED to 0/off after attempts 1-2.
# Attempt 3 (this key=2, DEPTH-1's ram_vram_promote_top_k HELD at its own
# settled 2 -- not raised this time -- + DEPTH-2 k=4): the conservative
# retry flagged after attempt 2 -- isolates whether a SMALL
# attn_pilot_vram_promote_top_k alone, without also blowing up DEPTH-1's
# own volume, behaves differently. Relies on the same cross-pilot dedup
# fix from attempt 2 (n_pilot_promote_dedup_skipped) so DEPTH-1's own
# top-2 promotion naturally skips anything ATTN-PILOT's top-2 already
# promoted this transition, regardless of which of the two blocks runs
# first in execution_layer.cpp (the dedup is symmetric -- whichever runs
# first "wins" a shared pick, the other is skipped either way) -- exactly
# the "DEPTH-1: top-2 again, if not loaded by ATTN-PILOT" semantics
# requested, no code change needed beyond the dedup already shipped.
# RESULT (3 runs): decode 0.88/0.88/0.83 tok/s (mean 0.863), cache hit
# 64%/-/- (one run logged), promotion attempted 3322-3659 with 2254-2549
# (~68-70%) caught by cross-pilot dedup, RAM waste 24.1-29.0% (elevated vs
# the ~11-12% single-source baseline, but far from attempts 1/2's 40-50%).
# NOT a regression -- unlike attempts 1/2, every run landed at or inside
# the established 0.84-0.87 baseline band, no run fell dramatically below
# it. But not a clearly confirmed win either: run 3 (0.83) sits at the
# baseline band's low edge, not above it, so the two 0.88 runs could be
# this hardware's own known run-to-run noise rather than a real uplift.
# REVERTED to 0/off, same "promising, not yet decisive" status as the
# plain ATTN-PILOT hint-push test above -- more runs (or a longer/
# different prompt, per this session's own standing caution about
# single-prompt conclusions) needed before treating either as settled.
# Attempt 4: this key=1 (even more conservative than attempt 3's 2),
# DEPTH-1 still held at its own settled top-2, DEPTH-2 top-4 unchanged.
# RESULT (3 runs): decode 0.85/0.85/0.84 tok/s (mean 0.847) -- tighter and
# MORE consistent than attempt 3's 0.88/0.88/0.83, but this time landing
# dead-center of the 0.84-0.87 baseline band rather than at/above its top.
# cache=63% hit (one run logged), promotion attempted 3059-3203 with
# 1218-1341 (~40-42%) caught by cross-pilot dedup (lower dedup fraction
# than attempt 3's ~68-70%, as expected -- ATTN-PILOT's own promotion pool
# shrank from top-2 to top-1, so less of it overlaps DEPTH-1's own top-2),
# RAM waste 26.2-27.8% -- essentially unchanged from attempt 3's 24.1-29.0%
# despite the smaller VRAM-promotion cutoff, because RAM waste here is
# driven mainly by the RAM-hint-push volume (DEPTH-2 top-4 + ATTN-PILOT's
# k=8 wide push), which is identical between attempts 3 and 4 -- only the
# VRAM promotion cutoff differs. Zero errors, not a regression. REVERTED
# to 0/off. Between attempts 3 and 4, neither shows a clear win over
# baseline; attempt 3's two 0.88 runs are the closest either got to a real
# uplift, but its own third run (0.83) already showed that band isn't
# fully separated from noise either. No further narrowing of THIS knob
# alone looks likely to resolve the ambiguity -- more runs of whichever
# variant, or a longer/different prompt, would be needed, not a smaller
# top_k.
attn_pilot_vram_promote_top_k = 0

