# Dual-role CoreEngine expert-cache slice, kept SMALL (1.3GB) deliberately
# -- 12 (dense) + 3 (kv_cache) = 15 of this card's 16GB, leaving only
# ~1GB fixed margin. attn_output's own BF16 fast-path already can't fit
