# the CPU per-head matmul() loop -- real isolated bench at GLM-5.2's actual
# dims (H=64 nope=192 kvl=512) showed 4.38x at S=1 (decode, dominant call
# volume), see CLAUDE.md for the full writeup. UNVERIFIED end-to-end on a
# real generation run as of this writing -- this is the first real test.
# WUK's BF16 copy lives on the CoreEngine GPU (RTX 5060 Ti here), the same
# card CLAUDE.md flags as already tight on VRAM from the attn_output BF16
# fast-path budget -- watch the startup "[MLA] qabsorb BF16 GPU fast-path:
# N/78 layer(s) uploaded" line; if N < 78, some layers fell back to CPU
# (safe, just less benefit than the isolated bench implies).
# NOTE: this MUST live at root scope, before any [[gpus]] table header --
# a prior placement after the second [[gpus]] block silently scoped it as
# a field of gpus[1] instead of the root document (TOML: everything after
# a [[table]] header belongs to that table until the next header), so
# doc.root.get_bool() never saw it and two real runs silently ran the old
# CPU path despite this file correctly showing "= true" on disk. Root-
# caused via a direct grep of debug.log's own "[CONFIG] MLA qabsorb..."
# line still reading "off" seconds after the file was confirmed edited.
