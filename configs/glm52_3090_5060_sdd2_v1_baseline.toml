# 8/12/16 too: both landed in the same 0.85-0.87 band as 8 (diminishing
# returns past 8, claimed-by-decode already near its floor by k=8) --
# settled on 8 rather than paying the extra hint volume/RAM churn for no
# further measured gain. active_layer_prewarm_issue (H2D pre-warm into the
# active-layer area) is now the single largest remaining decode bucket
