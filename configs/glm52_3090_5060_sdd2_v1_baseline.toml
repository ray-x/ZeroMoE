# mirror's (~1.18MB at cap=512, even less below that) -- shrinking the cap
# 4x only bought WUV +4 layers (30->34/78) and moved decode/cache-hit only
# within this hardware's own established noise band (0.844-0.876 tok/s,
# 66-69% hit -- no trend either direction). NOT a productive lever; kept at
