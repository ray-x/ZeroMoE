# "Pilot recall by rank (DEPTH-1, ram-only)" -- the exact population this
# feature acts on (RAM-resident, not-yet-VRAM-resident l+1 predictions):
# k0=99.4%(n=1017) k1=97.3%(n=1112) k2=96.8%(n=1204) k3=92.9%(n=1332)
# k4=87.4%(n=1476) k5=79.0%(n=1580) k6=65.7%(n=1567) k7=47.5%(n=1651) --
# confidence stays high through k2, then genuinely breaks (k3 already a real
# step down, k4+ a cliff). 2 chosen to capture the two highest-confidence
# ranks without reaching into k3's meaningfully weaker territory -- lands on
# the same value DeepSeek settled on, but derived from GLM's own curve, not
# copied. Always COPY-mode internally (allow_move=false, do_promote_ram_
# slot_to_vram) regardless of move_on_promotion above, so a wrong
# speculative guess never deletes its own RAM fallback. UNVERIFIED ON REAL
# HARDWARE for GLM specifically -- first real test, and GLM has a structural
# wrinkle DeepSeek doesn't (use_active_layer_area=true sits a THIRD tier
# between RAM and main VRAM), so the interaction is genuinely untested.
# Watch cache-hit rate and Three-tier caching's active-layer-upload count
# (a win here should show up as FEWER active-layer uploads, since decode
# increasingly finds experts already in the main VRAM cache instead of
# falling through to the reactive active-layer path).
# 2026-08-14: found live at 3, contradicting this comment's own conclusion
