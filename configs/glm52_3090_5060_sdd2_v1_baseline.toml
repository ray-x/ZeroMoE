ram_vram_promote_layer_gate = false
ram_vram_promote_layer_gate_threshold = 0.65
ram_vram_promote_layer_gate_min_samples = 30

# 2026-08-26: direct graduation of the veto-only gate above into a smooth
# per-layer WIDTH, per user feedback that the plain veto moved nothing
# either way -- mutually exclusive with ram_vram_promote_top_k above (set
# to 0 above to activate this mode instead).
# REAL A/B history, 3-tier design (same prompt as every other test in this
# file, 3-4 runs each), before the 5-tier widening below:
#   threshold=0.80/max_k=4 (i.e. ANY layer >=80% got k=4): a real
#   regression -- decode 0.86/0.80/0.80 (mean 0.82, vs the 0.84-0.87
#   baseline band), cache 67/64/63% (below the 65-71% band in 2 of 3 runs).
#   Same failure shape as this project's other over-aggressive promotion
#   regressions (top_k=3/4/8 flat) -- a layer's own aggregate accuracy
#   (hits/topk_sum, pooled across ALL ranks) doesn't guarantee every
#   individual rank within it is strong, the same per-layer-vs-per-rank
#   axis mismatch that made the plain veto gate unable to rescue top_k=3.
#   threshold=0.80/max_k=3 (one step above the settled base of 2, not two):
#   a real, consistent win -- 4 runs, decode 0.88/0.86/0.87/0.85 (mean
#   0.865, at-or-above the baseline band's own top, never dipped low),
#   cache 68/67/68/67% (mean 67.5%), zero errors.
# 2026-08-26 follow-up: user asked whether a NARROWER, higher band (e.g.
# >=90%) deserves an even wider k=4, given the >=80% population that
# regressed above is broad (~60 of 75 tracked layers). A real
# [PILOT-BY-LAYER] capture confirmed a genuine, much narrower >=90%
# population exists (~11-15 of 75 tracked layers, run-to-run, mostly
# layers 54-66 plus a few scattered ones like 24/51/52/69/75 -- routing
# isn't bit-exact on this hardware, so this count varies slightly run to
# run). Widened from 3 tiers to 5 to test this directly. Real A/B, 3 real
# threshold_4 values tried, all a WASH against the clean k=3-only win
# above -- none beat it, none severely regressed either (verified this
# isn't a resource-non-release artifact between back-to-back runs: GPU
# VRAM and host RAM both confirmed fully clean between runs, and the
# sequence recovered to its best-ever value immediately after its worst,
# ruling out a monotonic degradation):
#   t4=0.90/t3=0.80 (~15 layers get k4): decode 0.87/0.86/0.86/0.80 (mean
#   0.848), cache 67/67/67/64% (mean 66.25%) -- 1 real low outlier.
#   t4=0.93/t3=0.80 (~6-7 layers get k4, narrower): decode 0.85/0.86/0.84
#   (mean 0.85), cache 67/67/65% (mean 66.3%) -- no severe outlier, but
#   still below the k3-only baseline's own mean.
#   t4=0.93/t3=0.85 (also narrows the k3 band, ~38 layers instead of ~58):
#   decode 0.88/0.86/0.84 (mean 0.86), cache 68/67/65% (mean 66.7%) --
#   closest to the baseline, still not clearly better.
# Honest conclusion: adding a k=4 tier hasn't demonstrated a real benefit
# at ANY threshold tried on this prompt/hardware -- every variant landed
# at or slightly below the clean k3-only win's own mean (0.865/67.5%,
# zero outliers across 4 runs), never clearly above it. REVERTED to the
# proven win as the live default: threshold_4=0.99 makes k=4 practically
