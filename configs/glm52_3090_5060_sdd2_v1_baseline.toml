# prefetch_pilot_k: raised 4->8 (2026-08-19), real same-prompt A/B on real
# hardware. Root cause: the "Unified RAM claim" report line showed only
# 2538/5546 decode misses (45.7%) were being served by a prefetch worker --
# the other 3008 (54.3%) raced ahead of any worker and paid for a REAL
# decode-thread-blocking disk read (phase_b's own cost, ~9.8s of decode
# wall time that run). k=4 simply wasn't pushing enough candidate hints per
# layer transition to cover the real miss population in time. Raising to 8
# roughly doubled hint volume/layer and flipped the ratio: claimed-by-decode
# dropped to ~970-990 (a ~3x reduction), phase_b collapsed ~9.8s->~4.5-4.9s,
# decode 0.78-0.82->0.83-0.87 tok/s across 4 repeat runs (mean ~0.85,
