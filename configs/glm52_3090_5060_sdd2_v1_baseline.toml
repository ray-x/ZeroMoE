# own history), which grows prefetch_staging_slots' pinned host memory --
# memory NOT counted against this budget (see that field's comment) -- on
# top of an already-thin ~9GB of system slack. Restore real headroom first;
# raise back only after confirming with free -h / dmesg that swap/OOM
# wasn't the actual cause.
# 2026-08-16: was 120.0 (95.6% of this box's real 125.5GB physical RAM,
# WAY past the 86%-of-physical ratio this file's own comment above already
# established as the safe target once before, at 64GB/55GB) -- real swap
# activity DIRECTLY measured during a live run at 120.0: swap used peaked
# at 5.87GB (from a resting ~0.4GB), MemAvailable dropped to a 13.27GB
# minimum, 989174 major page faults in one 61s request. This exact data
# (quantized expert weights) compresses at ~1.000x in zram -- see
# zram-swap-pathological memory note -- so every byte swapped here is
# real CPU cost for zero space benefit, not a graceful degrade. Matches
# this file's own prior host_ram_gb incident (comment above) almost
# exactly, just re-drifted after a RAM upgrade raised the ceiling without
# re-deriving a safe margin. Cut to 108.0 (~86% of 125.5GB, restoring the
